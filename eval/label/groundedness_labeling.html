const DATA = {"items": [{"id": "fact_1af251df85", "text": "2020년 한국 시니어 케어푸드 시장에서 현대그린푸드는 '그리팅' 브랜드 론칭 및 1000억원 투자로 '스마트 푸드센터' 건설", "topic": "시니어 가정간편식(HMR)", "region": "한국", "topic_relevance": "한국 시니어 케어푸드 시장 점유율 1~3위 기업 및 현대그린푸드 그리팅, CJ프레시웨이 헬씨누리, 풀무원 시니어케어 점유율 비교", "source_url": "https://www.mkhealth.co.kr/news/articleView.html?idxno=71900", "source_excerpt": "DATED. 2026-07-29 03:00 (수) -- 본문영역 이전 기사보기 다음 기사보기 에이지테크⑪ '3조원' 케어푸드 시장 선점 나선 식품업계 공유하기 바로가기 복사하기 본문 글씨 줄이기 본문 글씨 키우기 스크롤 이동 상태바 현재위치 &nbsp;홈 기획리포트 에이지테크⑪ '3조원' 케어푸드 시장 선점 나선 식품업계 기자명 김보람 기자 입력 2025.03.05 06:00 댓글 0 구글 선호 검색 출처로 추가 공유하기 바로가기 복사하기 본문 글씨 줄이기 본문 글씨 키우기 SNS 기사보내기 이메일(으)로 기사보내기 다른 공유 찾기 --> 이 기사를 공유합니다 카카오톡(으)로 기사보내기 페이스북(으)로 기사보내기 트위터(으)로 기사보내기 카카오스토리(으)로 기사보내기 URL복사(으)로 기사보내기 닫기 국내 케어푸드 시장 3조원 규모 CJ프레시웨이·풀무원 선발 주자 현대그린푸드 '연화식'으로 차별화 아워홈, 신세계푸드 등도 사업 확장 [사진 = 게티이미지뱅크]&nbsp; 초고령화사회에 화 아워홈, 신세계푸드 등도 사업 확장 [사진 = 게티이미지뱅크]&nbsp; 초고령화사회에서 &#39;케어푸드(고령친화식품)&#39; 시장이 급성장하고 있다. 케어푸드는&nbsp;케어푸드는 특별한 영양 공급이 필요한 고령자 및 환자를 대상으로 한 맞춤형 식품이다. 소화되기 쉽게 묽고 부드럽게 만든 유동식이 주를 이룬다. 현재 많은 식품 기업이 케어푸드 연구 개발로 경쟁력을 높이며 시장 성장을 이끄는 상황.&nbsp;식품의약품안전처는 국내 케어푸드 시장이 지난 2018년부터 연 평균 7.9%씩 성장하며 올해 3조원에 이를 것으로 내다봤다.&nbsp; 지난 2015년&nbsp;CJ프레시웨이와 풀무원은&nbsp;일찍이 케어푸드 시장에 뛰어들었다. CJ프레시웨이는 당시 케어푸드 전문 브랜드 &#39;헬씨누리&#39;를 론칭했다. 같은 해 풀무원푸드머스는 &#39;풀스케어&#39;를 내놨다.&nbsp;CJ프레시웨이는&nbsp;노인복지시설에 고령자 맞춤형 건강 식단을 선보이는 급식 사업에&nb J프레시웨이는&nbsp;노인복지시설에 고령자 맞춤형 건강 식단을 선보이는 급식 사업에&nbsp;주력하고 있다. 올해는 이동급식 시장을 주목했다. 이동급식은 단체 급식이 필요하지만 주방 시설이 없는 시설에 찾아가 식사를 제공하는 방법이다. 이달 CJ프레시웨이는&nbsp;노인요양시설 이동급식 전문 기업 서진푸드와 약 200평 규모의 대형 조리시설을 조성했다. 서진푸드는 현재&nbsp;수도권 150여 개의 요양시설에 반&middot;완조리된 식사를 이동급식 형태로 제공 중이다.&nbsp; CJ프레시웨이 관계자는 &quot;초고령화 시대에 접어들면서 실버 급식의 중요도가 점차 커지고 있는 가운데, 이동급식 등 새로운 서비스가 주목받을 것으로 예상된다&quot;며 &quot;서진푸드와의 협업을 통해 최적화된 식단과 서비스를 제공하고, 헬씨누리&nbsp;브랜드 경쟁력을 한층 더 끌어올릴 것&quot;이라고 말했다.&nbsp; 풀무원푸드머스의 고령자를 위해 부드러움과 영양균형, 기호성 등 기준에  말했다.&nbsp; 풀무원푸드머스의 고령자를 위해 부드러움과 영양균형, 기호성 등 기준에 맞춘 식품을 선보인다. 식사부터 디저트, 건강 보조제 등 제품군을 갖췄다. 최근 케어푸드 수요가 커지자 소비자 접점을 확대하는 상황. 기존엔 제품을&nbsp;노인복지&middot;요양시설 등 대형 시설 위주에 유통했으나 시장이 커지자 지난 2020년 온라인 판매를 시작했다.&nbsp; 현대그린푸드는&nbsp;특히 유동식보다 영양 섭취가 용이한 &#39;연화식&#39;으로 차별성을 높이고 있다. 지난 2020년&nbsp;케어푸드 전문 브랜드 &#39;그리팅&#39;을 선보였으며 약 1000억원을 투자해 전문 제조 시설인 &#39;스마트 푸드센터&#39;를 준공했다. 연화식은 일반 음식과 맛과 형태는 유사하면서 혀나 잇몸으로 섭취 가능할 만큼 부드럽게 조리한 식품이다. 현대그린푸드에 따르면 재료를 모두 갈아 만드는 유동식보다 맛과 종류가 다양하다. 현대그린푸드는 올해부턴&nbsp;연세대 치과대학과 만드는 유동식보다 맛과 종류가 다양하다. 현대그린푸드는 올해부턴&nbsp;연세대 치과대학과&nbsp;치의학 전문 연구 기술을 활용한 공동 임상연구를 진행한다. 고령의 보철 치료 환자를 대상으로 점도와 영양성분이 조절된 연화식과 유동식 등을 제공한 뒤, 케어푸드가 치료 효과 증진과 삶의 질 향상에 기여하는 정도를 검증하는 방식이다. 현대그린푸드 관계자는 &quot;케어푸드를 통한 식단 관리는 꾸준히 오래 먹는 게 중요한 만큼, 다양성이 필수적&quot;이라며 &quot;이번 임상연구를 통해 고령층의 간편하고 균형 잡힌 영양 섭취를 돕는 케어푸드 제조 역량을 한층 강화할 수 있을 것&quot;이라고 기대했다.&nbsp; 후발주자로는 2021년부터 운영된 아워홈의 케어푸드 브랜드 &#39;케어플러스&#39;, 2020년 론칭한 신세계푸드의 &#39;이지밸런스&#39; 등이 있다. 아워홈은 2023년부턴 노인의 저작 능력 개선을 위한 훈련용 식품 개발을 시작해 올해 상용화를 목표로 연구 중", "token_candidates": [{"token": "2020년", "verbatim": true}, {"token": "1000억", "verbatim": true}, {"token": "푸드센터", "verbatim": true}], "prefill_numeric": "있음"}, {"id": "fact_385b2b976c", "text": "CJ프레시웨이는 2015년 한국 시니어 케어푸드 시장에서 '헬씨누리' 케어푸드 전문 브랜드를 론칭한 후 2025년 6월 노인요양시설 이동급식 기업 '서진푸드'와 협약해 종합 솔루션 사업을 확대했다", "topic": "시니어 가정간편식(HMR)", "region": "한국", "topic_relevance": "한국 시니어 케어푸드 시장 점유율 1~3위 기업 및 현대그린푸드 그리팅, CJ프레시웨이 헬씨누리, 풀무원 시니어케어 점유율 비교", "source_url": "https://www.donga.com/news/Economy/article/all/20251013/132550526/2", "source_excerpt": "노인-환자 위한 ‘케어푸드’ 뜬다… 올해 시장규모 3조 전망｜동아일보 본문으로 바로가기 검색창 닫기 궁금하신 [ 김정은 민도희 장윤기 박찬호 남궁민 오늘의운세 무릎 관절염 소지섭 국제멸종위기종 SK그룹 카심 조마르트 토카예프 구준엽 도서관 후진 최저임금 신혼부부 엔비디아 윤석열 전북경찰 의대 정청래 청년 캥거루족 아파트 영덕 기술 유출 성매매 관혼상제 도널드 트럼프 이재명 대통령 SK하이닉스 방사광가속기 건강보험료 오늘의 운세 지방선거 단일종목 레버리지 동물 파킨슨병 반도체 이채원 이차전지 순천향대 맥도날드 박용우 박진영 식단 정선희 바다 이지혜 코스피 일론머스크 진종오 검찰개혁 정호영 국민의힘 손담비 강미정 조정식 이수지 최수종 공직선거법 서울 스퀴시 조직폭력배 보릿돌교 부츠카리 철구 문천식 일본 아나운서 차가원 김정난 민주당 일본 지진 백린 현직 경찰 한동훈 뉴진스 ] 키워드를 검색해 보세요. 추천 검색어는 많이 본 뉴스 기사의 키워드를 수집하여 선정하였습니다. 검색 지우기 오피 PDF서비스 회원라운지 신문구독 동아디지털아카이브 보이스뉴스 동아방송 DBS 동아APP서비스 English 中文(簡体) 日本語 경제 영올드 식은 단체 급식이 필요하지만 주방 시설이 없는 시설에 찾아가 식사를 제공하는 방법이다. 이달 CJ프레시웨이는&nbsp;노인요양시설 이동급식 전문 기업 서진푸드와 약 200평 규모의 대형 조리시설을 조성했다. 서진푸드는 현재&nbsp;수도권 150여 개의 요양시설에 반&middot;완조리된 식사를 이동급식 형태로 제공 중이다.&nbsp; CJ프레시웨이 관계자는 &quot;초고령화 시대에 접어들면서 실버 급식의 중요도가 점차 커지고 있는 가운데, 이동급식 등 새로운 서비스가 주목받을 것으로 예상된다&quot;며 &quot;서진푸드와의 협업을 통해 최적화된 식단과 서비스를 제공하고, 헬씨누리&nbsp;브랜드 경쟁력을 한층 더 끌어올릴 것&quot;이라고 말했다.&nbsp; 풀무원푸드머스의 고령자를 위해 부드러움과 영양균형, 기호성 등 기준에  말했다.&nbsp; 풀무원푸드머스의 고령자를 위해 부드러움과 영양균형, 기호성 등 기준에 맞춘 식품을 선보인다. 식사부터 디저트, 건강 보조제 등 제품군을 갖췄다. 최근 케어푸드 수요가 커지자 소비자 접점을 확대하는 상황. 기존엔 제품을&nbsp;노인복지&middot;요양시설 등 대형 시설 위주에 유통했으나 시장이 커지자 지난 2020년 온라인 판매를 시작했다.&nbsp; 현대그린푸드는&nbsp;특히 유동식보다 영양 섭취가 용이한 &#39;연화식&#39;으로 차별성을 높이고 있다. 지난 2020년&nbsp;케어푸드 전문 브랜드 &#39;그리팅&#39;을 선보였으며 약 1000억원을 투자해 전문 제조 시설인 &#39;스마트 푸드센터&#39;를 준공했다. 연화식은 일반 음식과 맛과 형태는 유사하면서 혀나 잇몸으로 섭취 가능할 만큼 부드럽게 조리한 식품이다. 현대그린푸드에 따르면 재료를 모두 갈아 만드는 유동식보다 맛과 종류가 다양하다. 현대그린푸드는 올해부턴&nbsp;연세대 치과대학과 만드는 유동식보다 맛과 종류가 다양하다. 현대그린푸드는 올해부턴&nbsp;연세대 치과대학과&nbsp;치의학 전문 연구 기술을 활용한 공동 임상연구를 진행한다. 고령의 보철 치료 환자를 대상으로 점도와 영양성분이 조절된 연화식과 유동식 등을 제공한 뒤, 케어푸드가 치료 효과 증진과 삶의 질 향상에 기여하는 정도를 검증하는 방식이다. 현대그린푸드 관계자는 &quot;케어푸드를 통한 식단 관리는 꾸준히 오래 먹는 게 중요한 만큼, 다양성이 필수적&quot;이라며 &quot;이번 임상연구를 통해 고령층의 간편하고 균형 잡힌 영양 섭취를 돕는 케어푸드 제조 역량을 한층 강화할 수 있을 것&quot;이라고 기대했다.&nbsp; 후발주자로는 2021년부터 운영된 아워홈의 케어푸드 브랜드 &#39;케어플러스&#39;, 2020년 론칭한 신세계푸드의 &#39;이지밸런스&#39; 등이 있다. 아워홈은 2023년부턴 노인의 저작 능력 개선을 위한 훈련용 식품 개발을 시작해 올해 상용화를 목표로 연구 중 료로 패러다임 전환을 에이지테크③ 초고령으로 '빈집' 늘어…'빈집은행' 등 대책 시급 에이지테크② 갑자기 치매가 찾아왔다면, 내 금융자산 관리 어떻게? 에이지테크① 2025년은 초고령사회 원년…헬스케어 빅뱅 에이지테크⑥ 100세 장수시대, 일하는 노인이 아름답다 에이지테크 기업②\"전문성이 힘\"…케어푸드 리딩하는 '현대그린푸드' '만성통증' 증상 아닌 질병…제대로 관리하려면 유산균, 뇌 건강에도 도움 될까…쎌바이오텍 \"CBT 유산균 효과 입증\" 치료법 없는 RSV 예방이 핵심…\"'아렉스비' 백신, 60세 이상 예방 효과 82.6%\" 시니어 소비 트렌드가 한 자리에 '에이지테크 포럼&네트워킹' 29일 개최 [에이지테크] ③김영선 소장 \"나를 위해 재산 쓰겠다는 시니어 증가… 소비자 인식 변화\" [에이지테크] 韓 초고령사회 진입… 매경헬스, '에이지테크'의 미래 조망 CJ프레시웨이, 외식 브랜드 전용 소스 개발 확대…\"올 상반기만 40여개 개발\" [AI 에이지테크] 디지털 전환 ", "token_candidates": [{"token": "2015년", "verbatim": true}, {"token": "풀무원푸드", "verbatim": true}], "prefill_numeric": "있음"}, {"id": "fact_269ca73dfc", "text": "풀무원의 시니어 케어푸드 브랜드 디자인밀이 한국 시니어 케어푸드 시장에서 최다 고령친화우수식품(14종)을 보유하고 있다.", "topic": "시니어 가정간편식(HMR)", "region": "한국", "topic_relevance": "헬씨누리 케어푸드 시니어 연화식 세트 가격과 시장점유율 순위 비교 분석", "source_url": "https://biz.newdaily.co.kr/site/data/html/2023/09/13/2023091300087.html", "source_excerpt": "산 IT·전자 금융 증권 유통 제약·의료 생활·문화 TV 포토 뉴스레터 뉴데일리 검색 [시니어 시대] &quot;큰손 5060 잡아라&quot; 식품업계에 부는 건기식·연화식 바람 최신혜 기자 입력 2023-09-13 11:35 수정 2023-09-13 11:35 음성으로 듣기 공유하기 기사 공유하기 링크복사 카카오 페이스북 X(트위터) kakak --> 텔레그램 네이버 밴드 메일 https://biz.newdaily.co.kr/site/data/html/2023/09/13/2023091300087.html 주소가 복사되었습니다. 원하는 곳에 붙여넣기 하세요. 글자크기 가 가 가 가 음성으로 듣기 고령친화산업식품시장 2030년 5조6000억원까지 성장할 듯 경제력 가진 5060 주요 소비층 떠오르며 &#39;케어푸드&#39; 수요 커져 &#39;액티브 시니어&#39; 늘며 건기식 인기… 정관장 등 시니어 브랜드 론칭 이미지 크게보기 ▲ CJ프레시웨이의 시니어 타깃 브랜드 헬씨누리ⓒC 등 시니어 브랜드 론칭 이미지 크게보기 ▲ CJ프레시웨이의 시니어 타깃 브랜드 헬씨누리ⓒCJ프레시웨이 홈페이지 photo big--> 초고령화 시대 진입이 머지 않았다. 전체 인구대비 65세 이상 인구비중이 20% 이상이면 초고령화 사회라고 분류하는데, 우리나라는 지난해 65세 인구가 901만8000명을 넘어서며 비중이 17.5%에 달했고, 2025년에는 20.3%에 달할 것으로 전망된다. 이와 함께 시간과 경제적 여유를 가진 50~60대 베이비부머 세대가 주요 소비층으로 부각되며 식품업계에도 새로운 바람이 불고 있다. 나이가 들어서도 좋아하는 식음료를 맛있게 즐기고 싶어하는 시니어들이 늘면서다. 식품산업통계정보 ‘시니어 세대와 식품산업’ 동향에 따르면 2012년 2조6700억원에 불과했던&nbsp;고령 친화산업 식품분야는 2020년 4조4400억원까지 커졌고, 2030년 5조6000억원까지 성장할 것으로 전망된다.&nbsp; ◇ \"더 맛있게, 더 부드럽게\" 케어푸드의 성장&nbsp 장할 것으로 전망된다.&nbsp; ◇ \"더 맛있게, 더 부드럽게\" 케어푸드의 성장&nbsp; CJ프레시웨이, 아워홈, 현대그린푸드 등 식자재유통기업들은 케어푸드 사업에 일찌감치 뛰어들어 영역을 넓히는 중이다. 자체 브랜드를 출시해 기업간거래(B2B) 등 경로로 판매하는 형식이다. CJ프레시웨이는 2015년 시니어 타깃 브랜드인 헬씨누리를 론칭했다. 헬씨누리 등 케어푸드 사업 부문의 매출은 올해 상반기 기준 전년 동기 대비 32% 성장한 것으로 나타났다. CJ프레시웨이는 케어푸드 시장 성장세에 발맞춰 관련 상품 카테고리를 확대하고 전국 병원, 복지관, 요양시설에 대한 식자재 유통 경쟁력을 강화하고 있다. 지난해 한국식품연구원의 '고령친화식품 KS인증(KS H 4897)', 한국식품산업클러스터진흥원의 '고령친화우수식품 인증' 등 국가 인증을 획득한 연화식 소스, 반찬류를 선보였으며, 앞으로도 고령친화식상품군을 지속 확대 유통할 계획이다. 2018년에는 아워홈이 프리미엄 식재 브랜드 '케 화식상품군을 지속 확대 유통할 계획이다. 2018년에는 아워홈이 프리미엄 식재 브랜드 '케어플러스'를 론칭해 케어푸드 제품 수요가 높은 전국 실버타운, 요양∙복지시설을 비롯해 병원, 어린이집 등 B2B 채널 공략에 집중하고 있다. 케어플러스 제품은 육류, 반찬류, 소스 드레싱류를 포함해 총 22종의 라인업을 구축하고 있다. 지난해 ‘연화식 양념육 3종’, 행복한맛남 메추리알 장조림, 쇠고기장조림 등 총 12종 제품이 농림축산식품부와 해양수산부로부터 고령친화우수식품으로 지정됐다. 이와 함께 시니어의 저작 능력 향상을 위한 맞춤형 식품 및 인지기능개선 관리 식단 연구 개발 등 케어푸드 사업을 강화해 나가고 있다. 관련 매출도 신장 중이다. 아워홈의 케어푸드 관련 올 1분기 매출은 2022년 동기 대비 약 52% 대폭 상승한 것으로 나타났다. 현대그린푸드는 케어푸드 전문 브랜드 '그리팅'을 2020년 론칭했다. 이를 위해 2018년 1300여명의 조리사와 700여명의 영양사 가운데 80여  론칭했다. 이를 위해 2018년 1300여명의 조리사와 700여명의 영양사 가운데 80여명을 선발해 케어푸드 연구소인 ‘그리팅 랩(LAB)’을 설립하기도 했다. 현재 자체 온라인몰 '그리팅몰'을 통해 300여종의 케어푸드 간편식을 판매하고 있으며, 1~2주 단위 케어푸드 정기구독 서비스도 함께 제공하고 있다. 이곳에서는 저당, 저칼로리, 고단백질 등 건강한 식습관을 제안하는 '건강식단', 개인별 건강관리 목적에 맞춰 선택 가능한 '챌린지 식단' 등 다양한 케어푸드 식단을 판매 중이다. 그리팅 케어푸드의 올해 상반기 매출은 지난해 같은 기간 대비 60% 이상 신장한 것으로 집계됐다. 종합식품기업 풀무원도 2015년 시니어 전문브랜드 ‘풀스케어’를 론칭하고 작년 세대별 브랜드를 통합한 ‘디자인밀’을 내놨다. 디자인밀은 연령, 성별 등을 고려한 맞춤형 서비스다. 지난해 ‘7Days 영양진밥’과 ‘7Days 영양덮밥소스’ 등 14종이 고령친화우수식품으로 지정되며 현재 최다 고령친화우수식품 Days 영양덮밥소스’ 등 14종이 고령친화우수식품으로 지정되며 현재 최다 고령친화우수식품 보유 기업으로 떠올랐다. 풀무원은 고령맞춤형 식품을 늘려가며 국내 시니어 케어푸드 시장을 확대해 나갈 계획이다. 이미지 크게보기 ▲ 정관장이 선보인 시니어 전문 브랜드 '장수:율'ⓒ정관장 photo big--> ◇ \"웰에이징이 꿈\" 건강기능식품 시장도 커져&nbsp; 적극적으로 소비하고 문화활동에 나서는 '액티브 시니어'가 늘며 건강기능식품(건기식) 수요도 높아지고 있다. 시니어 건기식은 이제 단순히 '노화 지연', '신체기능 활성' 등에 머물지 않고 세분화 된 기능을 담고 있다. 가장 두드러진 활약을 보이고 있는 기업은 한국인삼공사 정관장이다. '홍삼', '녹용' 등의 주요 소비층이 시니어인 만큼, 이들을 대상으로 한 제품을 연달아 출시하고 있는 것. 특히 최근에는 시니어 전문 브랜드 ‘장수:율(匠水:律)’을 론칭했다. 정관장은 시니어 시장에서 선제적 리더십을 확보하기 위해 자사의 ", "token_candidates": [{"token": "14", "verbatim": true}, {"token": "고령친화우수식품", "verbatim": true}], "prefill_numeric": "있음"}, {"id": "fact_4f002035ae", "text": "DS Smith(영국)는 2022년 유럽 시장에서 종이 및 판지 친환경 포장재를 공급하는 선도 기업으로, 의류 및 식품 산업 B2B 고객을 주요 대상으로 합니다.", "topic": "친환경 포장재", "region": "유럽", "topic_relevance": "유럽 전자상거래 부문 친환경 포장재 채택률 상위 5개 브랜드별 핵심 기능 및 가격대", "source_url": "https://www.databridgemarketresearch.com/press-release/europe-e-commerce-packaging-market", "source_excerpt": "&#xC18D; &#xAC00;&#xB2A5;&#xD55C; &#xC194;&#xB8E8;&#xC158;&#xACFC; &#xD601;&#xC2E0;&#xC774; &#xC131;&#xACF5;&#xC73C;&#xB85C; &#xAC00;&#xB29 "일부"}, {"id": "fact_55b35f9ca9", "text": "풀무원의 '풀스케어' 브랜드는 한국 시니어 케어푸드 시장에서 1~3단계 점도 조절 연화식 제품을 통해 씹기·삼키기 어려운 고령자에게 맞춤형 영양을 제공하며 경쟁하고 있다", "topic": "시니어 가정간편식(HMR)", "region": "한국", "topic_relevance": "헬씨누리 케어푸드 시니어 연화식 세트 가격과 시장점유율 순위 비교 분석", "source_url": "https://www.gokorea.kr/news/articleView.html?idxno=749966", "source_excerpt": "/사진=CJ프레시웨이 [공감신문] 박영신 기자=&nbsp;최근 초고령화 사회로 진입하는 가운데 식품업계가 고령화 시대에 발맞춰 케어푸드 시장 공략에 나섰다. 노인인구가 급증하면서 인구구조 변화 대응을 위해 시니어에게 적합한 케어푸드를 개발해&nbsp;시장에 진출하고 있는 것이다. --> 통계청의 장래인구추계에 따르면 2035년 국내 80세 이상 고령인구는 2022년보다 82.7% 늘어날 전망이다. 이에 따라 전세계 케어푸드 시장규모는 2023년 86억4800만달러에서 2028년 124억4900만달러까지 급증할 것으로 추산(농림식품기술기획평가원)됐다. 또 국내 케어푸드 시장 규모는 2020년 2조원에서 오는 2025년에 3조원으로 확대될 것으로 전망(농수산식품유통공사)됐다. CJ프레시웨이는 업계 최초로 케어푸드시장에 진출했다. 2015년 론칭한 &lsquo;헬씨누리&rsquo;는 시니어 특화 케어푸드 식자재 유통 전문 브랜드다. 헬씨누리는 고령화 시대 본격화와 케어푸드 시장 성장세에  푸드 식자재 유통 전문 브랜드다. 헬씨누리는 고령화 시대 본격화와 케어푸드 시장 성장세에 발맞춰 어르신 급식 및 관련 식자재 상품 카테고리를 확대하며 전국 노인복지시설, 요양시설, 요양병원 등 B2B 케어푸드 식자재 유통 경로에서의 경쟁력 강화에 박차를 가하고 있다. 대표 제품으로는 반&middot;완조리 상품으로 구성된 케어푸드 간편식 세트 &lsquo;소담한상&rsquo; 등이 있다. 소담한상은 필요 영양분과 기호에 따라 식단을 선택할 수 있도록 &lsquo;튼튼한상(칼슘)&rsquo;, &lsquo;고기한상(단백질)&rsquo; 2종으로 출시됐다. CJ프레시웨이는 소담한상의 라인업을 지속 확대할 예정이다. 현대그린푸드는 건강관리를 위한 케어푸드 뿐 아니라 시니어를 위한 &#39;고령친화우수식단&#39;, 질환자를 위한 전문 케어푸드 식단인 &#39;메디푸드&#39; 등 다양한 케어푸드 라인업을 선보이고 있다. 현대그린푸드는 지난 2016년부터 &lsquo;케어푸드&rsquo;를 업을 선보이고 있다. 현대그린푸드는 지난 2016년부터 &lsquo;케어푸드&rsquo;를 차세대 성장동력의 하나로 정하고 연화식 개발에 나섰다. 이후 2017년 B2C 연화식 브랜드 &#39;그리팅 소프트&#39;를 론칭했다. 지난 2022년 4월에는&nbsp;전문 케어푸드 식단 메디푸드를 선보였다. 메디푸드는 적절한 영양섭취가 필수적인 질환자들이 간편하게 식이조절을 할 수 있도록 식품의약품안전처가 규정한 질환별 표준 제조기준에 맞춰 개발된 특수의료용도식품을 말한다. 2022년 당뇨식단과 암환자식단을 선보이며 메디푸드 사업을 본격화한 데 이어 지난해 8월과 10월에는 각각 투석환자와 비투석환자를 위한 신장질환식단도 출시했다. 아울러 현대그린푸드는 여러 대형병원에 단체급식을 제공해 오며 쌓은 전문 환자식 제조 노하우를 바탕으로 질환자들의 간편한 영양관리를 돕기 위해 메디푸드 라인업을 지속 확대해 나갈 방침이다. 수술 후 건강회복을 위한 충분한 영양섭취가 필수적이지만 소화불량과 입맛   나갈 방침이다. 수술 후 건강회복을 위한 충분한 영양섭취가 필수적이지만 소화불량과 입맛 저하로 단백질 섭취가 어려운 암환자를 위해 단백질 함유량이 높으면서도 속이 편한 &lsquo;유청단백 콩비지감치찜&rsquo;, &lsquo;버섯 다시마밥&rsquo;, &lsquo;황태순두부 백탕&rsquo; 등 메디푸드 인기 메뉴를 개발하기도 했다. 풀무원은 &#39;디자인밀&#39; 시니어 전문 브랜드 &#39;풀스케어&rsquo;를 선보였다. 풀스케어는 고령자의 원활한 식사와 영양 보충을 위해 형태와 물성, 성분 등을 조정해 가공됐다. 풀스케어 제품은 물성과 점도 특성에 따라 1단계(치아 섭취)부터 2단계(잇몸 섭취), 3단계(혀로 섭취)로 구분된다. 1단계 제품은 씹고 삼키는 데 어려움을 겪는 고령자들이 편하게 식사할 수 있도록 부드러운 식감으로 만들어 섭취 편의성을 높였다. 여기에 고령자 식단에 부족하기 쉬운 영양소 비타민 D와 칼슘을 더해 건강함을 높인 것이 특징이다. 업계 관계자는 부족하기 쉬운 영양소 비타민 D와 칼슘을 더해 건강함을 높인 것이 특징이다. 업계 관계자는 &ldquo;최근 초고령화 사회로 접어들면서 시니어들을 겨냥한 케어푸드 시장 경쟁은 더욱 가열될 것으로 전망된다&rdquo;고 밝혔다. 박영신 기자 rainboweye07@gokorea.kr 다른기사 키워드 #케어푸드 #현대그린푸드 #CJ프레시웨이 #풀무원 관련기사 현대그린푸드, 연세대 치대와 손잡고 시니어 특화 케어푸드 개발 현대그린푸드, 고령층 특화 식음료서비스 선보여 신소비층 급부상 '액티브 시니어' 공략하려면? CJ프레시웨이, '미래복지경영'과 사회복지시설 급식서비스 '협력' 저작권자 &copy; 공감신문 무단전재 및 재배포 금지 개의 댓글 회원로그인 작성자 비밀번호 댓글 내용입력 0 / 400 등록 댓글 정렬 최신순 추천순 답글순 BEST댓글 BEST 댓글 답글과 추천수를 합산하여 자동으로 노출됩니다. 닫기 더보기 댓글삭제 삭제한 댓글은 다시 복구할 수 없습니다. 그래도 삭제하시겠습니", "token_candidates": [], "prefill_numeric": "해당없음"}, {"id": "fact_b68c7a6ca1", "text": "상위 5개 업체가 2023년 북미 웨어러블 헬스케어 기기 시장에서 약 34%의 점유율을 차지했다", "topic": "웨어러블 헬스케어 기기", "region": "북미", "topic_relevance": "2023년 북미 웨어러블 헬스케어 기기 시장 점유율 1~3위 기업 및 시니어 타겟팅 제품 라인업", "source_url": "https://www.360researchreports.com/ko/market-reports/wearable-healthcare-devices-market-203366", "source_excerpt": "료 서비스 제공자가 웨어러블 데이터를 임상 워크플로우에 통합하고 약 58%의 만성 질환 환자가 웨어러블 건강 모니터링 솔루션에 의존하고 있습니다. 스마트워치 기반 기기는 전체 출하량의 거의 52%를 차지하고 피트니스 추적기는 33%를 차지합니다. 미국은 가장 강력한 시장 중 하나입니다. 1억 2,400만 명 이상의 성인이 웨어러블 건강 기기를 사용하고 의료 시스템의 약 45%가 웨어러블 환자 생성 데이터를 통합하고 있습니다. 미국 고용주의 약 39%가 웨어러블 건강 모니터링 인센티브를 제공하고 있으며, 약 3,100만 명의 미국 노인이 만성 치료를 위해 의료용 웨어러블을 사용하고 있습니다. 스마트워치는 미국 웨어러블 출하량의 56%를 차지하고, 원격 환자 모니터링 웨어러블은 수량 기준으로 28% 성장했습니다. 무료 샘플 다운로드 이 보고서에 대해 더 알아보세요. 주요 결과 주요 시장 동인: 디지털 모니터링에 대한 환자 선호도가 높아짐에 따라 사용자의 68% 이상이 일일 건강 추적에  털 모니터링에 대한 환자 선호도가 높아짐에 따라 사용자의 68% 이상이 일일 건강 추적에 의존하고 거의 44%가 사용하고 있습니다. 주요 시장 제한: 높은 장치 비용은 계속해서 채택에 영향을 미치고 있으며, 약 32%의 구매자가 경제성 문제를 언급하고 약 29%의 기업이 고급 웨어러블 배포에 대한 예산 제한을 보고했습니다. 새로운 트렌드: AI 기반 웨어러블은 기업 의료 플랫폼에서 거의 41% 채택률을 보이고 있으며, 스마트 바이오센서 웨어러블은 36% 이상 확대되고 있습니다. 지역 리더십: 북미는 약 48%의 시장 점유율을 차지하고 있으며, 아시아 태평양 지역은 약 31%의 점유율로 강력한 모멘텀을 유지하고 있으며 유럽은 거의 19%로 그 뒤를 따르고 있습니다. 경쟁 환경: 상위 5개 업체는 거의 34%의 점유율을 차지하고 있으며, 70개 이상의 신흥 브랜드가 틈새 웨어러블 의료 애플리케이션에서 경쟁하고 있습니다. 시장 세분화: 스마트워치는 거의 52%의 점유율로 지배적이며, 피트 서 경쟁하고 있습니다. 시장 세분화: 스마트워치는 거의 52%의 점유율로 지배적이며, 피트니스 추적기는 28%, 의료용 바이오센서는 14%, 스마트 패치는 6%를 차지합니다. 최근 개발: 새로운 웨어러블 헬스케어 제품 출시의 27% 이상이 AI 진단을 통합하고 있으며, 약 22%는 실시간 임상 모니터링을 위한 고급 바이오센서를 내장하고 있습니다. 웨어러블 헬스케어 기기 시장 최신 동향 웨어러블 헬스케어 기기 시장은 스마트 바이오센서, 실시간 모니터링 도구, AI 지원 분석의 채택이 늘어나면서 상당한 변화를 겪고 있습니다. 전 세계적으로 4억 2천만 명 이상의 사람들이 의료용 웨어러블을 사용하고 있는 이 부문은 임상 등급 장치 애플리케이션에서 상당한 성장을 목격하고 있습니다. 생체 인식 센서가 장착된 스마트 의류는 전년 대비 거의 23% 증가했으며, 심전도 및 혈당 모니터링 기능을 갖춘 생체 통합 패치는 만성 질환 관리 분야에서 사용자 보급률이 37% 이상을 기록했습니다. AI 기반   패치는 만성 질환 관리 분야에서 사용자 보급률이 37% 이상을 기록했습니다. AI 기반 웨어러블 진단은 기업 의료 플랫폼의 배포 증가로 인해 거의 46% 확장되었습니다. 한편, 심장학 애플리케이션용으로 설계된 의료용 웨어러블은 현재 전체 장치 사용량의 28% 이상을 차지하고 호흡 모니터링 웨어러블은 17%를 차지합니다. 피트니스에 중점을 둔 소비자 사이에서 수면 모니터링 웨어러블 사용률이 64%까지 증가했습니다. 배터리 수명이 길고 지속적인 모니터링 장치에 대한 수요가 31% 이상 증가했습니다. 또한 고급 웨어러블 데이터 플랫폼의 B2B 채택이 약 39% 증가했는데, 이는 임상 기관, 보험사의 관심 증가를 반영합니다. 웨어러블 헬스케어 기기 시장 역학 운전사 \"원격 환자 모니터링 채택 증가\" 원격 환자 모니터링은 계속해서 웨어러블 헬스케어 장치 시장의 주요 동인이 되고 있으며, 전 세계적으로 7천만 명 이상의 활성 원격 모니터링 웨어러블 사용자와 거의 57%의 병원이 웨어러블 통합 7천만 명 이상의 활성 원격 모니터링 웨어러블 사용자와 거의 57%의 병원이 웨어러블 통합 치료 시스템을 배포하고 있습니다. 이러한 성장은 전 세계적으로 5억 3,700만 명이 넘는 당뇨병 환자와 약 13억 명이 고혈압을 앓고 있는 만성 질환의 증가로 더욱 강화되어 지속적인 건강 추적을 제공하는 장치에 대한 수요가 증가하고 있습니다. 원격 환자 모니터링 웨어러블은 임상 심장학 애플리케이션에서 사용량이 42% 이상 증가했으며 수술 후 회복 설정에서 거의 33% 확장된 것으로 보고되었습니다. 의료 서비스 제공자의 49% 이상이 웨어러블에서 생성된 실시간 데이터로 인해 운영 효율성이 향상되었다고 보고합니다. 구속 \" 고급 웨어러블의 높은 비용과 제한된 접근성 \" 높은 장치 비용은 웨어러블 의료 장치 시장에 영향을 미치는 가장 중요한 제한 사항 중 하나로 남아 있습니다. 소비자의 거의 32%가 주요 채택 장벽으로 가격을 언급하고 의료 기업의 27% 이상이 웨어러블 배포에 대한 예산 문제를  택 장벽으로 가격을 언급하고 의료 기업의 27% 이상이 웨어러블 배포에 대한 예산 문제를 보고했습니다. 의료용 바이오센서 웨어러블은 소비자용 장치보다 최대 3배 더 비쌀 수 있어 저소득층과 소규모 의료 서비스 제공자에 대한 보급이 제한됩니다. 또한 거의 21%의 사용자가 유지 관리 또는 액세서리 교체 비용으로 인해 웨어러블 사용을 중단합니다. 제한된 보험 상환(현재 많은 국가에서 18% 미만)으로 인해 특히 원격 환자 모니터링 프로그램의 채택이 더욱 제  수 있도록 기준&middot;규격을 지속해서 신설 &middot;개정했다. 시장도 커지고 있다. 식약처에 따르면 메디푸드 시장 규모는 2019년 779억원에서 2021년 1648억원으로 2배 넘게 성장했다. 인구 고령화와 규제 완화로 개발에 뛰어드는 기업도 계속 늘고 있어 시장은 더욱 커질 전망이다.&nbsp;&nbsp; 풀무원 암환자용 식단형 식품. [풀무원] 풀무원, 현대그린푸드, 대상웰라이프 ;&nbsp; 풀무원 암환자용 식단형 식품. [풀무원] 풀무원, 현대그린푸드, 대상웰라이프, 일동후디스는 이미 시장에 진출했다. 풀무원은 암, 당뇨환자를 위한 메디푸드를 지난해 출시했다. 먼저 선보인 건 당뇨 관리를 돕는 건강간편식 &lsquo;디자인밀 당뇨케어 Meal Plan&rsquo;다. 메뉴는 총 12가지다. 밥류는 탄수화물이 천천히 소화 흡수될 수 있도록 백미를 최소화하고 흑미, 쥐눈이콩, 귀리, 수수 등을 사용한 잡곡밥 위주다. 반찬류는&nbsp;다양한 채소, 단백질찬, 샐러드 등으로 구성됐다. 총 열량 대비 당류와 포화지방은 각 10% 미만으로 설계하고, 단백질은 한 끼 당 18g 이상, 나트륨은 1350mg 이하로 맞췄다. 지난달에는 암 경험자들의 건강한 영양 섭취를 위한 건강 간편식을 출시하며 사업을 확대했다. 지난 9월에는 대한암협회와 암환자용 식품 공동개발을 위한 업무협약을 체결하기도 했다. 암환자용 식단형 식품은 암 환자 및 암 경험자의 1회 취식량 기준을 고  체결하기도 했다. 암환자용 식단형 식품은 암 환자 및 암 경험자의 1회 취식량 기준을 고려해 한 끼 식사로도 충분한 영양분을 얻을 수 있도록 설계됐다. 메뉴는 10가지다. 밥류는 담백현미밥과 영양가득진밥으로 구분해 개인의 건강 상태와 취향에 따라 선택할 수 있고, 반찬류는 채소찬과&nbsp;단백질찬이 있다.&nbsp;&nbsp; 풀무원 관계자는 &ldquo;제품은 1일 2식으로 신선하게 조리해 보랭 가방에 담겨 집 앞으로 배송된다&rdquo;며 &ldquo;메뉴의 용기 필름을 살짝 뜯어 전자레인지에 2분만 데우면 한 끼 식사를 즐길 수 있다&rdquo;고 말했다. 현대그린푸드는 최근 케어푸드 전문 브랜드 &lsquo;그리팅&rsquo;의 정기구독형 암 환자 식단을 출시했다. 암 수술 이후 치료와 회복 과정에서 식단 관리가 필요한 소비자를 타깃으로 만든 식단으로, 식품의약품안전처의 &lsquo;암환자용 식단형 식품&rsquo; 표준 기준에 맞춰 개발된 특수의료용도품이다. 총 12종으 암환자용 식단형 식품&rsquo; 표준 기준에 맞춰 개발된 특수의료용도품이다. 총 12종으로 &lsquo;황태순두부백탕 세트&rsquo;, &lsquo;수삼삼계죽 세트&rsquo;, &lsquo;생강계피사태찜 세트&rsquo; 등으로 구성돼 있다. 현대그린푸드는 세계보건기구(WHO)와 세계암연구재단(WCRF)의 암 영향인자를 연구해 암 위험을 줄이는 식재료를 선정하고, 대한영양사협회에서 발간한 식사요법을 연구해 손쉽게 건강관리를 할 수 있는 식단형 식품으로 개발했다. 현대그린푸드 그리팅 식단. [현대그린푸드] 지난 4월에는 &lsquo;당뇨식단&rsquo; 24종을 출시했다. 회사 측에 따르면 그리팅 당뇨식단은 ▲다양한 당뇨식 레시피 ▲열량 500kcal 이상의 &lsquo;포만감 있는 한끼 식사&rsquo; ▲건강을 생각한 세심한 조리법 ▲주문 후 생산(오더메이드) 방식 등 4가지 측면에서 시중에 판매 중인 당뇨식단과 차별화했다.&nbsp; 현대그린푸드는 메디푸드 사업을 ", "token_candidates": [{"token": "케어푸드", "verbatim": true}], "prefill_numeric": "있음"}, {"id": "fact_321fd7a5e6", "text": "2023년 1월, 가민은 심전도(ECG) 기능에 대한 FDA 승인을 획득하여 웨어러블 헬스케어 기기 시장에서 기술 확장을 이끌었다.", "topic": "웨어러블 헬스케어 기기", "region": "미국", "topic_relevance": "2023~2030년 북미 웨어러블 품을 생산한다. 냉장형 식단 운영이 가능한 것도 자체 시설 덕분이라는 게 회사 측 설명이다. 현대그린푸드는 2028년까지 메디푸드 식단을 430종까지 확대한다는 계획이다. 또한 질환 전 단계의 위험군이나 가족력 등을 고려한 예방 차원의 ‘프리미엄 냉동 간편식’도 연내 선보인다. 박주연(상무) 현대그린푸드 그리팅사업부장은 “환자들이 일상에서 손쉽게 식이 조절을 할 수 있도록 연구개발과 투자를 이어갈 것” 부장은 “환자들이 일상에서 손쉽게 식이 조절을 할 수 있도록 연구개발과 투자를 이어갈 것”이라며 “케어푸드 선도 기업으로서 건강한 먹거리를 제공해 나가겠다”고 말했다. 한편, 현대그린푸드는 2020년 케어푸드 전문 브랜드 ‘그리팅’(GREATING)을 론칭한 이후 저당·단백질·저칼로리 등 500여종의 식단을 선보이며 국내 케어푸드 시장을 이끌고 있다. 최근에는 ‘헬씨에이징 식단’ 등 새로운 트렌드 상품도 내놓으며 시장을 확장 중이다. 서울비즈 Copyright ⓒ 서울신문 All rights reserved. 무단 전재-재배포, AI 학습 및 활용 금지 서울신문 추천 뉴스 ‘이혼’ 심수창, ‘19살 연하’ 미모의 女와 데이트 포착 ‘나솔’ 13기 영수, 성병 의혹에 결국… 헤르페스 검사 결과 보니 “잘 곳 찾아?” 여중생과 모텔·차량서 3차례 성관계한 30대男 결국 “티끌 모아 ‘반포 50억’ 아파트?” 조수빈 영상 역풍…현실은 더 멀어진 ‘내집마련’ [ 철구, ‘엑셀방송’ 女BJ들", "token_candidates": [{"token": "2020년", "verbatim": true}, {"token": "1000억", "verbatim": true}, {"token": "2028년", "verbatim": true}, {"token": "430", "verbatim": true}, {"token": "현대그린푸드", "verbatim": true}, {"token": "케어푸드", "verbatim": true}, {"token": "푸드센터", "verbatim": true}], "prefill_numeric": "있음"}, {"id": "fact_57bf8a234a", "text": "현대그린푸드는 한국 시니어 케어푸드 시장을 대상으로 고혈압 환자를 위한 정기 구독형 한식 식단(HMR) 제품을 출시했다", "topic": "시니어 가정간편식(HMR)", "region": "한국", "topic_relevance": "한국 시니어 케어푸드 시장 질환별 맞춤 식단 기능 비교: 현대그린푸드 고혈압/당뇨 식단, 풀무원 단계별 물성 조정 HMR, 매일유업 메디웰 영양보충음료", "source_url": "https://www.businesspost.co.kr/BP?command=article_view&num=346299", "source_excerpt": "Business Post Business Post HUFFPOST HUFFPOST 현대그린푸드, 고혈압 환자 위한 정기 구독형 한식 식단 선보여 페이스북 공유하기 X 공유하기 네이버 공유하기 카카오톡 공유하기 유튜브 공유하기 url 공유하기 인쇄하기 현대그린푸드, 고혈압 환자 위한 정기 구독형 한식 식단 선보여 | | | ▲ 현대그린푸드가 정기 구독형 식단 신제품 '고혈압식식단'(사진)을 내놨다. <현대그린푸드> | <저작권자(c) 비즈니스포스트 무단전재 및 재배포금지> HUFFPOST 씨저널 | | | 금융당국 단일종목 레버리지 ETF 과열에 '투자액 중 20%까지만 허용' 검토 : 이억원 \"업계가 스스로 유동성 조절해주길\" | | '갤럭시Z8' 시리즈 사전예약 시작 : 통신 3사 지원금 최대 57만5천 원 내걸고 점유율 지키기 사활 | | KB금융그룹이 구글 클라우드와 협력해 벌이는 일 : 직원은 제미나이로 데이터 분석하고, 고객은 AI와 대화하며 상품 찾는다 | 많이 본 기사 ", "token_candidates": [], "prefill_numeric": "해당없음"}, {"id": "fact_abe75046b9", "text": "스웨덴 BillerudKorsnas와 오스트리아 Alpla의 합작법인 파보코(Paboco)는 바이오 원료 기반 종이병을 개발해 플라스틱 사용량을 최대 65% 절감했으며, 유럽 시장에서 100% 바이오 원료 종이병 상용화를 목표로 한다", "topic": "친환경 포장재", "region": "유럽", "topic_relevance": "유럽 B2B 친환경 포장재 시장에서 경쟁사(5개사 이상)의 2023년 매출 대비 시장 점유율 및 제품 라인업 차이는 어떻게 되는가?", "source_url": "https://www.coldchaininsight.com/news/articleView.html?idxno=539", "source_excerpt": "이 있나? 국내외 친환경 포장재 개발 및 활용 사례 콜드체인 인사이트 입력 2021.12.10 10:20 댓글 0 글자크기 설정 가 가 기사의 본문 내용은 이 글자크기로 변경됩니다. 친환경 포장재 시장은 미국이 주도하고 있는 모양새다. 시장 규모가 크고 기술 연구도 활발한데다 친환경 제품에 대한 소비가 꾸준해 상용화 부담도 적은 편이기 때문이다. 유럽에서도 친환경 포장재 개발을 완료한 기업들이 속속 나타나고 있다. 유럽의 경우 유럽연합(EU)에서 2021년부터 일회용 플라스틱 사용을 금지하는 법안을 통과시킨 것이 이를 가속했다는 평가다. 우리나라도 친환경 포장재 개발에 나서고 있거나 제품에 적용하는 기업들이 늘어나고 있다. 다만 국내의 경우 플라스틱에 대한 규제보다 기업 스스로 사회공헌과 미래 시장을 대비한다는 측면에서 접근하는 경향이 강하다. 친환경 포장재를 개발하거나 활용한 대표적인 사례를 모아봤다. &nbsp;▣ 코카콜라 코카콜라 산하 병 제조사인 코카콜라 아말티(Coca-Co 모아봤다. &nbsp;▣ 코카콜라 코카콜라 산하 병 제조사인 코카콜라 아말티(Coca-Cola Amatil)는 rPET(폐플라스틱 재생) 원료로 페트병을 개발, 상용화에 성공했다. 이 제품은 순수 rPET만으로 제조된 것으로, 버려진 페트병으로 새 페트병을 만들어낸 세계 최초 사례로 기록됐다. rPET은 기술의 한계상 주로 의류나 섬유제품 제조에 사용되어왔다. 현재 코카콜라는 rPET 페트병을 사용한 제품을 호주 시장에 판매하고 있다. ▣ 에코로직 미국 에코로직(Ecologic)은 종이병인 &lsquo;에코보틀(Eco bottle)&rsquo;을 개발, 판매하고 있다. 에코보틀은 플라스틱 펌프를 결합해 분무기나 샴푸 용기 등으로 사용할 수 있는데, 외부 소재는 모두 재활용 종이로 제작됐으며, 내부에 플라스틱막을 입혀 오랫동안 재사용할 수 있다. 또한 폐기 시 종이와 플라스틱막을 분리할 수 있어 추가적인 재활용도 가능하다. 에코보틀은 동일한 크기의 용기보다 플라스틱을 최대&nbsp;7 추가적인 재활용도 가능하다. 에코보틀은 동일한 크기의 용기보다 플라스틱을 최대&nbsp;70% 적게 사용했으며 물에 닿아도 원형을 유지한다. ▣ KHS그룹 독일에 위치한 KHS그룹은 최대 100% 재활용 재료로 만든 페트병과 포장용 플라스틱 필름을 개발했다. ALPLA와 공동 개발한 페트병은 1리터 짜리로, 재활용 재료(rPET)로 만들었으며, 기존 제품보다 10g 더 가볍고 수거 후 세척해 재사용하는 것도 가능하다. 또한 rPET 필름 포장재는 페트병이나 캔 등을 포장할 때 사용할 수 있으며, 탄소발자국을 최대 65% 줄일 수 있다. 다만 다소 주름이 잘 생기는 것이 단점으로 지적되고 있다. ▣ 호프만 네오팩 호프만 네오팩(Hoffmann Neopac)은 100% 재활용 금속소재를 사용한 캔을 개발했다. 이 제품은 재활용된 강철과 주석을 함유하고 있으며, 폐기 시 이를 분리해 다시 재활용할 수 있다. 또한 생산 과정에서 기존 제품보다 에너지 사용량 60%를 절감할 수 있으며, 공기  있다. 또한 생산 과정에서 기존 제품보다 에너지 사용량 60%를 절감할 수 있으며, 공기와 습기를 차단해 신선도를 유지할 수 있다. &nbsp; ▣ 비그린패키징 미국 식품포장재 전문기업 비그린패키징(Be Green Packaging)은 천연 섬유를 혼합한 식품포장재를 개발, 판매하고 있다. 비그린패키징은 그릇, 식품트레이, 컵 뚜껑 등 다양한 식품포장재를 생산하고 있으며, 고객사 컨설팅을 통해 맞춤형 포장재도 만들 수 있다고 설명했다. 또한 미국 서부 미시간 재활용 인증, 미국 농무부 BioPreferred 인증, FSC과 BRC 등의 민간 인증을 보유하고 있다. 이 회사의 제품은 기존 플라스틱, 스티로폼 포장재와 동일한 형태, 거의 비슷한 강도와 기능을 제공하면서도 생분해성이 높아 퇴비로 만들 수 있다는 장점이 있다. ▣ 파보코 종이 포장재 전문업체 BillerudKorsnas와 병 제조 전문업체 Alpla의 합작법인인 파보코(Paboco, Paper Bottle Company) 문업체 Alpla의 합작법인인 파보코(Paboco, Paper Bottle Company)는 바이오 원료를 기반으로 종이병을 개발하고 있다. 이 종이병은 수분에 젖지 않도록 내면에 부착하는 플라스틱 필름 대신 바이오를 기반으로 한 코팅 기술을 적용한 것이 특징이며, 최대 65%의 플라스틱 사용량을 절감할 수 있다. 파보코는 지난 5월 시제품 2종을 공개한 뒤 글로벌 기업 P&amp;G와 손잡고 2022년까지 100% 바이오 원료를 사용한 종이병 시제품을 내놓을 계획이다. 특히 기존 종이병의 한계인 플라스틱 뚜껑 대신 종이 뚜껑 적용을 목표로 하고 있어 주목을 받고 있는 중이다. ▣ 그레이너 패키징 오스트리아의 그레이너 패키징(Greiner Packaging)은 플라스틱컵의 재활용률 100%에 초점을 맞춘 제품인 &lsquo;K3 R100&rsquo;을 개발했다. 이 제품은 가장 재활용률이 높은 투명한 플라스틱컵에 골판지로 제작된 포장재를 입힌 것이다. 플라스틱에 필름을 접착한 기존  투명한 플라스틱컵에 골판지로 제작된 포장재를 입힌 것이다. 플라스틱에 필름을 접착한 기존 제품은 필름이 깨끗하게 떨어지지 않아 폐기되는 경우가 많지만 제품은 컵(플라스틱)과 이를 감싼 포장재(골판지)를 깨끗하게 분리할 수 있다. 이 제품은 유럽의 민간 인증인 &lsquo;RecyClass 재활용성 인증&rsquo;으로부터 90% 재활용이 가능하다는 의미의 클래스A 등급을 획득한 바 있다. ▣ 풀무원 창립 초기부터 LOHAS 기업을 목표로 삼았던 풀무원은 ESG 경영의 일환으로 다양한 친환경 포장재를 제품에 적용하고 있다. 출시하는 전 제품에 &lsquo;환경을 생각한 포장재 원칙&rsquo;을 적용하고 있는 풀무원은 플라스틱 사용량을 줄이고(Reduce), 재활용이 쉬운 포장재를 사용하고(Recycle), 포장재에 남는 화학물질을 제거(Remove)한다는 내용의 3R활동을 지속하고 있다. 특히 지난 1월에는 국내 최초로 바이오 페트(Bio-PET) 재질의 친환경 샐러드 용기", "token_candidates": [{"token": "65%", "verbatim": true}, {"token": "100%", "verbatim": true}, {"token": "Paboco", "verbatim": true}], "prefill_numeric": "있음"}, {"id": "fact_629b7427d5", "text": "풀무원 푸드앤컬처는 한국 시니어 케어푸드 시장에서 '지속가능식생활 체험 식단 프로그램'을 통해 혈당 관리용 211 식사법 기반 체험형 HMR 서비스를 제공하고 있다", "topic": "시니어 가정간편식(HMR)", "region": "한국", "topic_relevance": "한국 시니어 케어푸드 시장 점유율 1~3위 기업 및 현대그린푸드 그리팅, CJ프레시웨이 헬씨누리, 풀무원 시니어케어 점유율 비교", "source_url": "https://www.donga.com/news/Economy/article/all/20251013/132550526/2", "source_excerpt": "노인-환자 위한 ‘케어푸드’ 뜬다… 올해 시장규모 3조 전망｜동아일보 본문으로 바로가기 검색창 닫기 궁금하신 [ 김정은 민도희 장윤기 박찬호 남궁민 오늘의운세 무릎 관절염 소지섭 국제멸종위기종 SK그룹 이용자의 신체 지표 변화를 분석한 결과 전체 이용자 중 73%가 체지방, 근육량, 혈압 등 주요 건강 지표에서 긍정적인 개선 효과를 경험한 것으로 나타났다. CJ프레시웨이는 2015년 론칭한 케어푸드 전문 브랜드 ‘헬씨누리’ 사업 확대에 박차를 가하고 있다. 시니어 맞춤형 건강 식단 컨설팅을 제공하는 영양관리 프로그램까지 서비스 범위를 넓혔다. 6월에는 노인요양시설 이동급식 전문기업 ‘서진푸드’와 업무협약을 맺고 이동급식 시설에 케어푸드 종합 솔루션을 제공할 계획이다. 풀무원 푸드서비스 전문기업 푸드앤컬처는 위탁 급식 사업장에 ‘지속가능식생활 체험 식단 프로그램’을 도입했다. 체험 식단은 채소와 단백질, 통곡물을 2 대 1 대 1 비율로 하는 ‘거꾸로 211 식사법’을 기반으로 구성됐다. 채소 통곡물을 2 대 1 대 1 비율로 하는 ‘거꾸로 211 식사법’을 기반으로 구성됐다. 채소부터 먹는 식습관을 통해 혈당 변화를 완만하게 하고 식이섬유·단백질·파이토케미컬 등 다양한 영양소를 고르게 섭취할 수 있도록 유도한다. 업계 관계자는 “고령층뿐 아니라 건강에 관심을 갖는 모든 연령대에서 맞춤형 식단에 대한 수요가 빠르게 증가하고 있다”면서 “개인 건강 데이터를 바탕으로 한 맞춤형 라이프케어 솔루션으로 진화할 것”이라고 했다. 영올드＆ > 구독 구독 “은퇴 후에도 도시서 살고파”… 도심 시니어주택 공급 늘린다 노인-환자 위한 ‘케어푸드’ 뜬다… 올해 시장규모 3조 전망 ‘조용한 살인자’ 대장암 급증… “대장 내시경, 암 검진 기본 검사로” 이런 구독물도 추천합니다! 고양이 눈 구독 구독 정덕현의 그 영화 이 대사 구독 구독 지금, 여기 구독 구독 #케어푸드 #고령 인구 #영올드 #고령층 케어푸드 남혜정 기자 namduck2@donga.com © dongA.com All ", "token_candidates": [{"token": "211", "verbatim": true}], "prefill_numeric": "있음"}, {"id": "fact_97e58be842", "text": "현대그린푸드는 2016년부터 한국 시장에서 '메디푸드' 등 전문 케어푸드 식단을 개발하며 2022년 4월 신장질환식단을 포함한 특수의료용도식품을 출시했다", "topic": "시니어 가정간편식(HMR)", "region": "한국", "topic_relevance": "2022-2023년 국내 시니어 케어푸드 시장 신규 진입 브랜드 수와 주요 기업의 시장 점유율 현황은 어떻게 되는가?", "source_url": "https://www.gokorea.kr/news/articleView.html?idxno=749966", "source_excerpt": "식품업계, 초고령화 사회 대응 나섰다...케어푸드 시장 '공략' --> 주요서비스 바로가기 본문 바로가기 매체정보 바로가기 로그인 바로가기 기사검색 바로가기 전체서비스 바로가기 잠깐! 현재 Internet Explorer 8이하 버전을 이용중이십니다. 최신 브라우저(Browser) 사용을 권장드립니다! ie 인터넷 익스플로러 11 다운로드 chrome 구글 크롬 다운로드 firefox 모질라 파이어폭스 다운로드 전체메뉴 버튼 정치·입법공감 경제공감 경제일반 금융/증권/보험 종합 오늘공감 사회 핫이슈 인사/부고 종합 생활/문화 공감 공연/전시 레저 호텔 자동차 BOOK 글로벌공감 국제사회 미래공감 AI 드론 지역공감 엔터/스포츠 공감 엔터테인먼트 스포츠&게임 딥터뷰 오피니언 정정보도 UPDATED 2026-07-29 03:15 (수) 로그인 회원가입 검색버튼 기사검색 검색 이전 기사보기 다음 기사보기 식품업계, 초고령화 사회 대응 나섰다...케어푸드 시장 '공략' 다른 공유 찾기 기사 보기 식품업계, 초고령화 사회 대응 나섰다...케어푸드 시장 '공략' 다른 공유 찾기 기사스크랩하기 본문 글씨 줄이기 본문 글씨 키우기 스크롤 이동 상태바 산업공감 산업이슈 식품업계, 초고령화 사회 대응 나섰다...케어푸드 시장 '공략' 박영신 기자 입력 2024.01.26 17:01 수정 2024.01.26 22:20 다른 공유 찾기 기사스크랩하기 글씨크기 본문 글씨 줄이기 본문 글씨 키우기 인쇄하기 이 기사를 공유합니다 페이스북(으)로 기사보내기 트위터(으)로 기사보내기 카카오톡(으)로 기사보내기 네이버블로그(으)로 기사보내기 URL복사(으)로 기사보내기 닫기 CJ프레시웨이 헬씨누리·현대그린푸드 메디푸드 등 선보여 CJ프레시웨이 임직원이 지난해 추석명절을 맞아 독거어르신들에게&nbsp;&lsquo;헬씨누리&rsquo;&nbsp;케어푸드 간편식을 전달하기 위해 포장작업을 하고 있다.&nbsp;/사진=CJ프레시웨이 [공감신문] 박영신 기자=&nbsp;최근 초고령화 사회로 진입하는 가 /사진=CJ프레시웨이 [공감신문] 박영신 기자=&nbsp;최근 초고령화 사회로 진입하는 가운데 식품업계가 고령화 시대에 발맞춰 케어푸드 시장 공략에 나섰다. 노인인구가 급증하면서 인구구조 변화 대응을 위해 시니어에게 적합한 케어푸드를 개발해&nbsp;시장에 진출하고 있는 것이다. --> 통계청의 장래인구추계에 따르면 2035년 국내 80세 이상 고령인구는 2022년보다 82.7% 늘어날 전망이다. 이에 따라 전세계 케어푸드 시장규모는 2023년 86억4800만달러에서 2028년 124억4900만달러까지 급증할 것으로 추산(농림식품기술기획평가원)됐다. 또 국내 케어푸드 시장 규모는 2020년 2조원에서 오는 2025년에 3조원으로 확대될 것으로 전망(농수산식품유통공사)됐다. CJ프레시웨이는 업계 최초로 케어푸드시장에 진출했다. 2015년 론칭한 &lsquo;헬씨누리&rsquo;는 시니어 특화 케어푸드 식자재 유통 전문 브랜드다. 헬씨누리는 고령화 시대 본격화와 케어푸드 시장 성장세에  푸드 식자재 유통 전문 브랜드다. 헬씨누리는 고령화 시대 본격화와 케어푸드 시장 성장세에 발맞춰 어르신 급식 및 관련 식자재 상품 카테고리를 확대하며 전국 노인복지시설, 요양시설, 요양병원 등 B2B 케어푸드 식자재 유통 경로에서의 경쟁력 강화에 박차를 가하고 있다. 대표 제품으로는 반&middot;완조리 상품으로 구성된 케어푸드 간편식 세트 &lsquo;소담한상&rsquo; 등이 있다. 소담한상은 필요 영양분과 기호에 따라 식단을 선택할 수 있도록 &lsquo;튼튼한상(칼슘)&rsquo;, &lsquo;고기한상(단백질)&rsquo; 2종으로 출시됐다. CJ프레시웨이는 소담한상의 라인업을 지속 확대할 예정이다. 현대그린푸드는 건강관리를 위한 케어푸드 뿐 아니라 시니어를 위한 &#39;고령친화우수식단&#39;, 질환자를 위한 전문 케어푸드 식단인 &#39;메디푸드&#39; 등 다양한 케어푸드 라인업을 선보이고 있다. 현대그린푸드는 지난 2016년부터 &lsquo;케어푸드&rsquo;를 업을 선보이고 있다. 현대그린푸드는 지난 2016년부터 &lsquo;케어푸드&rsquo;를 차세대 성장동력의 하나로 정하고 연화식 개발에 나섰다. 이후 2017년 B2C 연화식 브랜드 &#39;그리팅 소프트&#39;를 론칭했다. 지난 2022년 4월에는&nbsp;전문 케어푸드 식단 메디푸드를 선보였다. 메디푸드는 적절한 영양섭취가 필수적인 질환자들이 간편하게 식이조절을 할 수 있도록 식품의약품안전처가 규정한 질환별 표준 제조기준에 맞춰 개발된 특수의료용도식품을 말한다. 2022년 당뇨식단과 암환자식단을 선보이며 메디푸드 사업을 본격화한 데 이어 지난해 8월과 10월에는 각각 투석환자와 비투석환자를 위한 신장질환식단도 출시했다. 아울러 현대그린푸드는 여러 대형병원에 단체급식을 제공해 오며 쌓은 전문 환자식 제조 노하우를 바탕으로 질환자들의 간편한 영양관리를 돕기 위해 메디푸드 라인업을 지속 확대해 나갈 방침이다. 수술 후 건강회복을 위한 충분한 영양섭취가 필수적이지만 소화불량과 입맛   나갈 방침이다. 수술 후 건강회복을 위한 충분한 영양섭취가 필수적이지만 소화불량과 입맛 저하로 단백질 섭취가 어려운 암환자를 위해 단백질 함유량이 높으면서도 속이 편한 &lsquo;유청단백 콩비지감치찜&rsquo;, &lsquo;버섯 다시마밥&rsquo;, &lsquo;황태순두부 백탕&rsquo; 등 메디푸드 인기 메뉴를 개발하기도 했다. 풀무원은 &#39;디자인밀&#39; 시니어 전문 브랜드 &#39;풀스케어&rsquo;를 선보였다. 풀스케어는 고령자의 원활한 식사와 영양 보충을 위해 형태와 물성, 성분 등을 조정해 가공됐다. 풀스케어 제품은 물성과 점도 특성에 따라 1단계(치아 섭취)부터 2단계(잇몸 섭취), 3단계(혀로 섭취)로 구분된다. 1단계 제품은 씹고 삼키는 데 어려움을 겪는 고령자들이 편하게 식사할 수 있도록 부드러운 식감으로 만들어 섭취 편의성을 높였다. 여기에 고령자 식단에 부족하기 쉬운 영양소 비타민 D와 칼슘을 더해 건강함을 높인 것이 특징이다. 업계", "token_candidates": [{"token": "2016년", "verbatim": true}, {"token": "2022년", "verbatim": true}, {"token": "현대그린푸드", "verbatim": true}, {"token": "메디푸드", "verbatim": true}, {"token": "특수의료용도식품", "verbatim": true}], "prefill_numeric": "있음"}, {"id": "fact_d61f699955", "text": "DexCom Inc.는 북미 시니어 건강관리 시장에서 Medicare 보장 확대로 1,200만 명 추가 환자 접근을 예상하며 2형 비인슐린 환자 시장 확장을 통해 다중 년도 두 자릿수 성장 가능성이 있다", "topic": "웨어러블 헬스케어 기기", "region": "북미", "topic_relevance": "Dexcom Inc. price review comparison 2026", "source_url": "https://ca.finance.yahoo.com/news/heres-why-add-dexcom-stock-165300292.html", "source_excerpt": "82.60 +3.34 +4.21% ADVERTISEMENT Here's Why You Should Add DexCom Stock to Your Portfolio Now Zacks Equity Research April 17, 2026 5 min read DXCM +2.02% ^GSPC +0.21% PACB +2.21% GMED +2.98% BDSX -5.36% DexCom, Inc.&nbsp; DXCM is well positioned for growth in the coming quarters, supported by the significant potential of the continuous glucose monitoring (CGM) market. A strong fourth-quarter 2025 performance and a series of favorable coverage decisions are expected to contribute further. Risks r isions are expected to contribute further. Risks related to stiff competition persist. This Zacks Rank #2 (Buy) company's shares have lost 7.3% so far this year compared with the industry's 11.6% decline. The S&P 500 Index has gained 1.9% in the same time frame. DXCM, a renowned medical device company and provider of continuous glucose monitoring (CGM) systems, has a market capitalization of $24.23 billion. It projects a 20.6% growth rate over the next five years and anticipates maintaining a st e next five years and anticipates maintaining a strong performan 22년부터 현재까지 식약처 허가를 받아 출시한 메디푸드 제품은 총 247종에 달한다. 이 라인업은 당뇨환자용·암환자용·고혈압환자용·투석 신장질환자용·비투석 신장질환자용 등 식단을 보유하고 있다. 현대그린푸드가  혈압환자용·투석 신장질환자용·비투석 신장질환자용 등 식단을 보유하고 있다. 현대그린푸드가 다양한 메디푸드 식단을 개발할 수 있는 건 50년 이상 단체급식사업을 영위하며 다양한 영양 설계별 레시피를 확보해오고 있기 때문이다. 특히, 강릉아산병원과 국립중앙의료원, 아주대학교병원 등 전국 주요 의료시설들에 환자식을 제공하면서, 의료진과 환자의 피드백을 반영한 레시피를 쌓아온 게 메디푸드 개발과정에 밑거름이 됐다. 여기에 제조시설에 적극적으로 투자해 메디푸드를 생산할 수 있는 점도 현대그린푸드가 메디푸드 시장에서 입지를 구축하는 데 한 몫을 했다. 현대그린푸드는 지난 2020년 약 1000억원을 투자해 케어푸드 전문 제조시설 ‘스마트 푸드센터’를 만들어 운영하고 있다. 현대그린푸드 관계자는 “스마트 푸드센터에는 음식의 형태는 유지하면서 부드럽게 조리 가능한 ‘포화증기오븐’ 등 국내에서 찾아보기 어려운 전문 케어푸드 조리설비가 완비돼, 씹고 소화하기 편한 메디푸드를 만들 수 있다”고 설명했다 전문 케어푸드 조리설비가 완비돼, 씹고 소화하기 편한 메디푸드를 만들 수 있다”고 설명했다. 이어 “냉동형 중심의 메디푸드 시장에서 냉장형 식단을 운영할 수 있는 것도 자체 생산시설을 갖춘 덕”이라고 덧붙였다. 현대그린푸드는 메디푸드 역량을 강화하기 위해 제품 개발에 박차를 가할 방침이다. 오는 2028년까지 메디푸드 식단 종류를 현재 247종에서 430종까지 70% 이상 늘릴 계획이다. 식단 종류 확대와 더불어, 질환 전단계의 위험군이거나 가족력 등을 고려해 예방차원에서 식이조절을 하려는 소비자를 위한 ‘프리미엄 냉동 간편식’도 개발해 연내 선보일 계획이다. 박주연 현대그린푸드 그리팅사업부장은 “지속적인 연구 개발과 투자로 다양한 메디푸드를 식단을 계속 선보여 나갈 것”이라며 “이를 통해 케어푸드 시장을 선도하는 기업으로서의 자리를 더욱 공고히 해나갈 것”이라고 말했다. /melissa6888@sedaily.com 취재 : 김민영 기자 melissa6888@sedaily.com -", "token_candidates": [{"token": "2025년", "verbatim": false, "near": ["린푸드, 메디푸드 상반기 매출↑…“430종까지 늘린다” 경제·산업 입력 2025-08-06 09:58:36 수정 2025-08-06 09:58:36 김", "까지 늘린다” 경제·산업 입력 2025-08-06 09:58:36 수정 2025-08-06 09:58:36 김민영 기자 0개 가 가 가 가 2022년"]}, {"token": "247", "verbatim": true}, {"token": "18%", "verbatim": true}, {"token": "현대그린푸드", "verbatim": true}, {"token": "케어푸드", "verbatim": true}], "prefill_numeric": "일부"}, {"id": "fact_6d232ff25b", "text": "현대그린푸드는 2020년 한국 시니어 케어푸드 시장 진출을 위해 1000억원을 투자해 스마트 푸드센터를 구축했다.", "topic": "시니어 가정간편식(HMR)", "region": "한국", "topic_relevance": "그리팅 메디푸드 신장질환식단 가격대 및 2023년 상반기 매출 성장률 조사", "source_url": "https://www.sentv.co.kr/article/view/sentv202508060036", "source_excerpt": "AIR 검색 회사소개 개요 연혁 조직도 찾아오시는 길 고객센터 공지사항 문의하기 자주하는 질문 인재채용 채용절차 채용공고 채용문의 --> 개인보호정책 개인정보취급방침 회원약관 청소년보호정책 윤리강령 및 기사배열방침 고충처리인 광고 및 제휴안내 방송광고 및 사업제휴 안내 기사 구매 문의  "verbatim": true}, {"token": "푸드센터", "verbatim": true}], "prefill_numeric": "있음"}, {"id": "fact_879fbb6515", "text": "CJ제일제당은 유럽 B2B 유통 시장에서 PHA 생분해성 바이오소재와 종이 기반 포장재를 개발하며, 폴 바셋 매장에 PHA 빨대 시범 도입 후 전 매장 확대를 추진 중이다.", "topic": "친환경 포장재", "region": "유럽", "topic_relevance": "유럽 전자상거래 부문 친환경 포장재 채택률 상위 5개 브랜드별 핵심 기능 및 가격대", "source_url": "https://www.g-enews.com/article/Distribution/2026/06/202606251516033071740eacf404_1", "source_excerpt": " 제약∙바이오 제약 바이오 헬스 소상공인 소상공인뉴스 지원사업 연합회소식 ESG경영 기업지배구조 ESG일반 오피니언 사설 기고 데스크칼럼 기자수첩 메뉴 EU 포장 규제 앞두고…식품업계 친환경 기술 '주목' 글로벌모빌리티 글로벌게이머즈 더 블링스 PDF지면보기 English 中文 로그인 회원가입 구독신청 facebook twitter youtube Telegram 검색 메뉴 식음료 패션∙뷰티 소비자 유통일반 생활일반 HOME &gt; 유통경제 &gt; 식음료 EU 포장 규제 앞두고…식품업계 친환경 기술 '주목' 황효주 기자 입력 2026-06-25 15:31 K푸드 EU 수출 15.1% 증가…친환경 포장 기술 관심 확대 PHA·TPS·종이 포장재 등 적용 범위 넓히는 식품기업 내구성·생산성·인증 등 상용화 과제는 여전 EU 포장 규제 앞두고…식품업계 친환경 기술 '주목' 이미지 확대보기 해양생분해 플라스틱 소재 PHA. 사진=CJ제일제당 오는 8월 유럽연합(EU)의 포장 및 포장폐기물  플라스틱 소재 PHA. 사진=CJ제일제당 오는 8월 유럽연합(EU)의 포장 및 포장폐기물 규정(PPWR) 일부 시행을 앞두고 국내 식품업계가 개발해온 친환경 포장 기술과 바이오소재가 다시 주목받고 있다. K푸드의 유럽 수출이 성장세를 이어가는 가운데 식품기업들이 개발해온 친환경 기술에도 관심이 쏠리고 있다. CJ제일제당과 대상, 농심 등 주요 식품기업들은 발효와 전분 기술을 기반으로 생분해성 플라스틱과 친환경 포장재 개발을 이어가고 있다. 기존 식품 제조 과정에서 축적한 기술을 활용해 새로운 사업 영역을 넓히는 동시에 친환경 소재 적용 범위도 확대하고 있다. 한국농수산식품유통공사(aT)에 따르면 올해 1~5월 농림수산식품의 EU 수출액은 5억4400만달러로 지난해 같은 기간보다 15.1% 증가했다. 같은 기간 전체 농림수산식품 수출 증가율(7.2%)을 웃도는 수준이다. EU는 오는 8월부터 PPWR 일부 규정을 시행한다. 해당 규정은 EU에서 유통되는 제품의 포장재를 대상으로 재활 PWR 일부 규정을 시행한다. 해당 규정은 EU에서 유통되는 제품의 포장재를 대상으로 재활용성 확보와 유해물질 제한 등을 담고 있으며, 재생원료 사용 확대 등 세부 기준은 단계적으로 적용될 예정이다. 정부도 최근 수출기업을 대상으로 관련 설명회와 컨설팅을 진행하는 등 대응 지원에 나섰다. 기업별 기술 개발도 이어지고 있다. CJ제일제당은 생분해성 바이오소재 PHA 상용화에 속도를 내고 있다. 최근 인도 바이오플라스틱 기업 콘스펙과 공급 계약을 체결했으며, 폴 바셋은 올해 초 일부 매장에서 PHA 빨대를 시범 도입한 데 이어 전 매장 확대를 추진하고 있다. 유한킴벌리와 협력해 생분해 위생행주를 선보였고, 화장품 용기와 칫솔, 인조잔디 충전재 등으로 적용 범위도 넓히고 있다. 이와 함께 폐페트(PET)를 효소로 분해해 원료를 회수하는 화학적 재활용 기술도 개발 중이다. 대상은 발효 기술과 옥수수 전분을 활용한 바이오소재 개발을 확대하고 있다. 동성케미컬과 함께 옥수수 전분 기반 열가소성 분을 활용한 바이오소재 개발을 확대하고 있다. 동성케미컬과 함께 옥수수 전분 기반 열가소성 전분(TPS)을 개발해 식품 포장용 필름과 물류용 에어캡 상용화를 추진하고 있으며, 발효 공정을 활용한 친환경 소재 연구도 이어가고 있다. 삼양사는 전분 사업에서 축적한 기술을 활용해 소재 사업을 확대하고 있다. 산업통상자원부 국책과제를 통해 옥수수와 감자 전분 가공 과정에서 발생하는 부산물로 산업용 원료를 생산하는 기술을 개발하고 있으며, 이소소르비드 등 바이오 기반 화학소재 사업도 확대하고 있다. 농심 계열사 율촌화학은 생분해성 고분자를 적용한 종이 기반 식품 포장재 개발에 집중하고 있다. 플라스틱 사용량을 줄이면서도 식품 보존에 필요한 차단 성능을 유지하는 기술 확보에 주력하고 있다. 다만 기술 개발이 곧바로 시장 확대를 의미하는 것은 아니라는 지적도 나온다. 친환경 소재를 실제 제품에 적용하기 위해서는 기존 포장재 수준의 내구성과 식품 보존성을 확보해야 하고, 생산 효율과 설비 투자 부 서는 기존 포장재 수준의 내구성과 식품 보존성을 확보해야 하고, 생산 효율과 설비 투자 부담, 국가별 인증 기준 등 상용화 과정에서 해결해야 할 과제도 적지 않기 때문이다. 업계 관계자는 \"유럽 시장을 비롯해 글로벌 시장에서는 제품뿐 아니라 포장재와 원료 관리 기준도 점차 까다로워지고 있다\"며 \"친환경 소재 기술 확보와 함께 생산성과 품질을 유지하면서 각국의 기준을 충족할 수 있는 상용화 역량도 기업 경쟁력의 중요한 요소가 될 것\"이라고 말했다. 황효주 글로벌이코노믹 기자 hyojuh@g-enews.com 온라인 구독신청 지면 구독신청 #경찰 #경찰 #경찰 #경찰 #경찰 #경찰 헤드라인 뉴스 日, 식료품 소비세율 8%서 1%로 대폭 인하 구마모토 강진에 반도체 클러스터 긴급 점검 SK하이닉스, 2Q 영업익 60.5조 '역대 최대' 美, 메디케어 처방약 보조금 지급 중단키로 현대제철, 美 루이지애나 전기로 제철소 착공 CATL, 전기차 넘어 AI 전력망·선박시장 확장 많이 본 기사 1", "token_candidates": [{"token": "PHA", "verbatim": true}], "prefill_numeric": "있음"}, {"id": "fact_d39a24ecb3", "text": "Schoeller Allibert는 유럽 B2B 유통 시장에서 자동차, 음료, 식품 분야 및 산업용 고객 대상으로 친환경 포장재를 공급하는 세계 시장 리더이다.", "topic": "친환경 포장재", "region": "유럽", "topic_relevance": "Schoeller Allibert 판매 채널 유통 파트너십", "source_url": "https://de.wikipedia.org/wiki/Schoeller_Allibert", "source_excerpt": "en am 7. Mai 2025.&lt;/ref>\"},\"Stand\":{\"wt\":\"2023-12-31\"},\"Branche\":{\"wt\":\"[[Kunststoffverarbeitung]]\"},\"Homepage\":{\"wt\":\"www.schoellerallibert.com\"}},\"i\":0}}]}'> Schoeller Packaging B.V. Logo Rechtsform B.V. Gründung 2005 Sitz Hoofddorp , Niederlande Niederlande Leitung Adrian Letts (CEO) Åke Bengtsson (CFO) Elizabeth Nugent (CCO) Jerome Vezin (COO) Mitarbeiterzahl ca. 1.600 (2023) [ 1 ] Umsatz 556,9 Mio. Euro (2023) [ 1 ] Branche Kunststoffverarbeitung Website www.schoellerallibert.com Stand:  rbeitung Website www.schoellerallibert.com Stand: 31. Dezember 2023 Die Schoeller Packaging B.V. ist ein niederländischer Kunststoffverpa atch 4 (45mm) &#8211; Android Smartwatch with Heart Rate &#8230; 6. Fitbit Charge 6 — Best Overall Fitbit What Our Testing Found Key Specs Fitbit Charge 6 Fitness Tracker with Google apps, Heart Rate on E&#8230; 7. Fit", "token_candidates": [{"token": "10일", "verbatim": false, "near": ["uyers: the Fitbit Inspire 3 at $79 with 10-day battery is exceptional value. Fitbi", "zon Fitbit Inspire 3 Best Budget Fitbit 10-day battery, lightweight, sleep trackin", "tery, lightweight, sleep tracking Up to 10 Days View on Amazon Fitbit Sense 2 Heal"]}, {"token": "79", "verbatim": true}, {"token": "Inspire", "verbatim": true}], "prefill_numeric": "일부"}, {"id": "fact_a3be1d3074", "text": "친환경 포장 시장은 재활용 원료 포장이 주도하고 있으며 종이 제품의 사용 증가는 높은 재활용률과 비용 효율성으로 유럽 시장 성장에 기여했다", "topic": "친환경 포장재", "region": "유럽", "topic_relevance": "2023-2028년 유럽 B2B 친환경 포장재 시장 규모 및 연평균 성장률(CAGR)은 얼마인가?", "source_url": "http://www.impacton.net/news/articleView.html?idxno=10308", "source_excerpt": "북(으)로 기사보내기 트위터(으)로 기사보내기 URL복사(으)로 기사보내기 닫기 &nbsp;사진/픽사베이 최신&nbsp;보고서 에 따르면, 전세계 친환경 포장 시장은 2023년까지 2383억9000만 달러 규모로 성장할 것으로 예상된다고 환경리더가 13일(현지시각) 전했다. 보고서는 2023년부터 2028년까지 친환경 포장 시장의 연평균 성장률(CAGR)은 6.44%에 달할 것이라고 한다. 이러한 급성장은 환경에 대한 전 세계적인 관심 증가와 환경 영향을 줄이기 위해 노력하는 기업의 친환경 포장 채택 때문이라고 한다. &nbsp; 친환경 포장 시장 성장은 종이 제품의 사용 증가가 크게 기여 보고서는&nbsp;친환경 포장을 지속 가능한 재료를 사용하거나 제조 공정에 재생 에너지를 통합하여 폐기물을 줄이는 포장으로 정의했다. 친환경 포장은 특히 전자상거래, 물류, 배달 식품 포장 분야에서 점점 더 널리 사용되고 있는 것으로 알려졌다. 환경리더에 의하면, 친환경 포장이 다양한 지속 가능성 널리 사용되고 있는 것으로 알려졌다. 환경리더에 의하면, 친환경 포장이 다양한 지속 가능성 이니셔티브와의 결합해서 저비용 구조가 되면 기업은 친환경 포장을 더욱 매력적으로 인식하게 된다. 친환경 포장 시장은 재활용 원료 포장이 주도하고 있다. 종이 제품의 사용 증가는 높은 재활용률과 비용 효율성으로 인해 시장 성장에 크게 기여했다. 분해성 포장도 재활용품과 함께 상당한 성장을 보일 것으로 예상된다고 한다. 식품 및 음료 부문은 현재 전체 친환경 포장 산업에서 가장 큰 시장 점유율을 차지하고 있으며, 개인 관리용품 시장은 모든 부문 중에서 가장 높은 연평균 성장률(CAGR)을 보일 것으로 예상된다. 보고서에 따르면 유럽은 일회용 플라스틱에 대한 엄격한 금지와 순환 경제 이니셔티브로 친환경 포장 시장을 지배하고 있다. 현재 개발 단계에 있는 UN플라스틱 조약에는 녹색 포장 시장의 추가 성장으로 이어질 수 있는 플라스틱 소비에 대한 법적 구속력 있는 규정이 포함될 것으로 예상된다. 친환경 질 수 있는 플라스틱 소비에 대한 법적 구속력 있는 규정이 포함될 것으로 예상된다. 친환경 포장 시장 성장의 또 다른 주요 동인은 전자상거래 부문의 친환경 포장 채택이다. 소비자는 종종 포장을 기준으로 회사의 지속 가능성 노력을 측정하는 경향이 있으므로 지속 가능한 재료를 사용하여 제품을 전시하고 전달하는 것이 온라인 소매 전략의 핵심이 되었다. 보고서는 일반 플라스틱의 지속 가능한 대안인 바이오플라스틱이 성장에 몇 가지 장애물에 직면해 있다고 밝혔다. 일부 주요 바이오플라스틱 회사는 재고에 문제가 있으며, 바이오플라스틱과 생분해성 포장재는 일반적으로 농산물을 사용하기 때문에 자연재해로 인해 관련 공급망이 중단됐다. 보고서에서는 소노코(Sonoco Products Company), 암코(Amcor), 몬디(Mondi), 웨스트락(WestRock Company), 테트라(Tetra Laval),볼(Ball Corporation)을 친환경 포장 산업의 주요 업체로 꼽았다. 관련기사 【그", "token_candidates": [], "prefill_numeric": "해당없음"}, {"id": "fact_26cd84da0f", "text": "EU PPWR(Regulation (EU) 2025/40)은 포장재를 판매 포장, 단위 포장, 운송 포장으로 분류하고 중금속 규제를 적용한다.", "topic": "친환경 포장재", "region": "유럽", "topic_relevance": "유럽 B2B 친환경 포장재 시장에서 경쟁사(5개사 이상)의 2023년 매출 대비 시장 점유율 및 제품 라인업 차이는 어떻게 되는가?", "source_url": "https://www.kcrlab.co.kr/eu-ppwr-시행-2026년-8월-12일부터/", "source_excerpt": "[EU PPWR 시행] 2026년 8월 12일부터 유럽 수출 제품 포장재 중금속 규제 적용 - 케이씨알(KCR) 콘텐츠로 바로가기 국내인증 KC 방송통신기자재 전자파 인증 자기적합확인 등록 안내 KC 전기안전 KC 어린이제품 안전확인대상 생활화학제품 CA인증 ISO 9001 해외 인증 유럽 CE CE Toy Safety Directive(완구) 인증 안내 E MARK 북미 캐나다 ISED FCC 아시아 베트남 베트남 CR마크 인증 대만 기타 일본 PSE 일본 TELEC 일본 VCCI 중국 CCC 중국 CQC 중국 SRRC 남미 ANATEL 신뢰성 시험 방수방진시험(IPXX) 염수분무시험 진동시험 Qi인증 라돈 시험 코로나 바이러스 살균(사멸)시험 국가지원사업 수출 기회 바우처 해외규격인증획득지원사업 혁신바우처 지원사업 인증 소식 고객센터 견적 문의 자료실 자주하는 질문 (FAQ) 고객 피드백 회사소개 회사소개 프로젝트 실적 조직도 찾아오시는 길 Search KOR ENG [EU PP 사소개 회사소개 프로젝트 실적 조직도 찾아오시는 길 Search KOR ENG [EU PPWR 시행] 2026년 8월 12일부터 유럽 수출 제품 포장재 중금속 규제 적용 2026년 07월 24일 | 은미 손 | 인증가이드 , 해외인증 목차 📦1. 핵심 개정 내용 📅2. 시행 및 적용 일정 📖3. 법적 근거 및 고시 정보 안녕하세요. 수입 전기전자제품 KC 인증 대행 및 컨설팅 전문 기관 주식회사 케이씨알(KCR)입니다. 2026년 8월 12일부터 시행되는 EU PPWR(Regulation (EU) 2025/40)에 따라 EU 시장에 유통되는 제품은 제품뿐만 아니라 포장재 및 포장 구성요소까지 환경 규제를 충족해야 합니다. 특히 포장재에 포함된 납(Pb), 카드뮴(Cd), 수은(Hg), 6가 크롬(Cr⁶⁺) 의 농도 합계가 100mg/kg(100ppm) 을 초과할 경우 통관 지연, 판매 제한, 리콜 등의 위험이 발생할 수 있어 사전 점검이 필요합니다. 📦 1. 핵심 개정 내용 적용 대 콜 등의 위험이 발생할 수 있어 사전 점검이 필요합니다. 📦 1. 핵심 개정 내용 적용 대상: EU 시장에 출하·유통되는 모든 CE 인증 제품의 포장재 및 포장 구성요소 수축 필름, 비닐봉지, 페트병, 내지 포장재, 상자, 트레이, 완충재(폼, 에어캡, 파우치), 포장용 테이프, 라벨 등 포장 단계를 3단계로 나누어 구분 판매 포장(Sales packaging): 소비자가 매장에서 사는 그대로의 포장 (예: 샴푸 병, 과자 봉지) 단위 포장(Grouped packaging): 판매 포장 여러 개를 하나로 묶은 것, 분리해도 제품에 영향이 없는 것 (예: 캔맥주 6개를 묶은 비닐랩) 운송 포장(Transport packaging): 운반 중 손상을 방지하기 위한 포장. 컨테이너는 제외 (예: 골판지 박스, 팔레트, 팔레트 랩) 판매 포장 단위 포장 운송 포장 주요 내용 (Article 5의 4항 세부 요구사항): 농도 합계 제한 규정: 포장재 또는 포장 구성요소에 포함된 4대 중금속( 세부 요구사항): 농도 합계 제한 규정: 포장재 또는 포장 구성요소에 포함된 4대 중금속(납, 카드뮴, 수은, 6가 크롬)의 중량 농도 합계가 100 mg/kg (100 ppm)을 초과할 수 없습니다. 적합성 평가 및 성적서 보유: 제조업체 및 수입업체는 포장재가 PPWR의 중금속 기준을 충족함을 입증할 수 있도록 시험성적서(Test Report), 공급업체의 적합성 자료 및 관련 기술문서를 확보·관리하여야 합니다. 공급망 관리 의무: 완제품 제조업체뿐만 아니라 포장재를 공급하는 원자재 공급업체 역시 분석 데이터 및 성적서를 수입자/제조자에게 제공할 법적 의무가 발생합니다. 기대 효과: EU 환경 규제 미준수로 인한 통관 거부, 제품 회수(Recall), 판매 금지 및 과태료 부과 등의 리스크 사전 차단 재활용성이 높은 친환경 포장재 전환을 통해 유해물질 유입 차단 및 친환경 브랜드 이미지 제고 📅 2. 시행 및 적용 일정 시행일: 8월 12일부터 (유럽 시장 내 실제 유통 및 판매  📅 2. 시행 및 적용 일정 시행일: 8월 12일부터 (유럽 시장 내 실제 유통 및 판매 시 필수 적용) 📖 3. 법적 근거 및 고시 정보 EU PPWR (Packaging and Packaging Waste Regulation): Regulation (EU) 2025/40 Article 5(4) &#8220;The sum of concentration levels of lead, cadmium, mercury and hexavalent chromium resulting from substances present in packaging or packaging components shall not exceed 100 mg/kg.&#8221; (포장재 또는 포장 구성요소에 존재하는 물질에서 기인한 납, 카드뮴, 수은, 6가 크롬의 농도 합계는 100 mg/kg을 초과할 수 없다.) ← 말랑이·왁뿌볼 KC 어린이제품 안전인증 및 매장 진열 기준 정리 고객 상담 전자파·안전 · 신뢰성 0", "token_candidates": [{"token": "2025", "verbatim": true}, {"token": "40", "verbatim": true}, {"token": "EU", "verbatim": true}, {"token": "PPWR", "verbatim": true}, {"token": "Regulation", "verbatim": true}], "prefill_numeric": "있음"}, {"id": "fact_1142cb3e54", "text": "2021년 기준 북미 웨어러블 의료 기기 시장에서 Apple Inc.(미국), Fitbit(미국), Garmin(미국) 등 미국 기반 기업들이 주요 시장 참여자로 활동 중", "topic": "웨어러블 헬스케어 기기", "region": "북미", "topic_relevance": "2023년 기준 북미 웨어러블 헬스케어 시장에서 Apple Inc, Fitbit, Garmin의 FDA 승인 제품별 시니어 사용자 점유율 및 평균 판매 가격 조사", "source_url": "https://www.databridgemarketresearch.com/ko/reports/north-america-wearable-medical-devices- 편식(HMR)", "region": "한국", "topic_relevance": "한국 시니어 케어푸드 시장 점유율 1~3위 기업 및 현대그린푸드 그리팅, CJ프레시웨이 헬씨누리, 풀무원 시니어케어 점유율 비교", "source_url": "https://www.mkhealth.co.kr/news/articleView.html?idxno=71900", "source_excerpt": "DATED. 2026-07-29 03:00 (수) -- 본문영역 이전 기사보기 다음 기사보기 에이지테크⑪ '3조원' 케어푸드 시장 선점 나선 식품업계 공유하기 바로가기 복사하기 본문 글씨 줄이기 본문 글씨 키우기 스크롤 이동 상태바 현재위치 &nbsp;홈 기획리포트 에이지테크⑪ '3조원' 케어푸드 시장 선점 나선 식품업계 기자명 김보람 기자 입력 2025.03.05 06:00 댓글 0 구글 선호 검색 출처로 추가 공유하기 바로가기 복사하기 본문 글씨 줄이기 본문 글씨 키우기 SNS 기사보내기 이메일(으)로 기사보내기 다른 공유 찾기 --> 이 기사를 공유합니다 카카오톡(으)로 기사보내기 페이스북(으)로 기사보내기 트위터(으)로 기사보내기 카카오스토리(으)로 기사보내기 URL복사(으)로 기사보내기 닫기 국내 케어푸드 시장 3조원 규모 CJ프레시웨이·풀무원 선발 주자 현대그린푸드 '연화식'으로 차별화 아워홈, 신세계푸드 등도 사업 확장 [사진 = 게티이미지뱅크]&nbsp; 초고령화사회에 화 아워홈, 신세계푸드 등도 사업 확장 [사진 = 게티이미지뱅크]&nbsp; 초고령화사회에서 &#39;케어푸드(고령친화식품)&#39; 시장이 급성장하고 있다. 케어푸드는&nbsp;케어푸드는 특별한 영양 공급이 필요한 고령자 및 환자를 대상으로 한 맞춤형 식품이다. 소화되기 쉽게 묽고 부드럽게 만든 유동식이 주를 이룬다. 현재 많은 식품 기업이 케어푸드 연구 개발로 경쟁력을 높이며 시장 성장을 이끄는 상황.&nbsp;식품의약품안전처는 국내 케어푸드 시장이 지난 2018년부터 연 평균 7.9%씩 성장하며 올해 3조원에 이를 것으로 내다봤다.&nbsp; 지난 2015년&nbsp;CJ프레시웨이와 풀무원은&nbsp;일찍이 케어푸드 시장에 뛰어들었다. CJ프레시웨이는 당시 케어푸드 전문 브랜드 &#39;헬씨누리&#39;를 론칭했다. 같은 해 풀무원푸드머스는 &#39;풀스케어&#39;를 내놨다.&nbsp;CJ프레시웨이는&nbsp;노인복지시설에 고령자 맞춤형 건강 식단을 선보이는 급식 사업에&nb J프레시웨이는&nbsp;노인복지시설에 고령자 맞춤형 건강 식단을 선보이는 급식 사업에&nbsp;주력하고 있다. 올해는 이동급식 시장을 주목했다. 이동급식은 단체 급식이 필요하지만 주방 시설이 없는 시설에 찾아가 식사를 제공하는 방법이다. 이달 CJ프레시웨이는&nbsp;노인요양시설 이동급식 전문 기업 서진푸드와 약 200평 규모의 대형 조리시설을 조성했다. 서진푸드는 현재&nbsp;수도권 150여 개의 요양시설에 반&middot;완조리된 식사를 이동급식 형태로 제공 중이다.&nbsp; CJ프레시웨이 관계자는 &quot;초고령화 시대에 접어들면서 실버 급식의 중요도가 점차 커지고 있는 가운데, 이동급식 등 새로운 서비스가 주목받을 것으로 예상된다&quot;며 &quot;서진푸드와의 협업을 통해 최적화된 식단과 서비스를 제공하고, 헬씨누리&nbsp;브랜드 경쟁력을 한층 더 끌어올릴 것&quot;이라고 말했다.&nbsp; 풀무원푸드머스의 고령자를 위해 부드러움과 영양균형, 기호성 등 기준에  말했다.&nbsp; 풀무원푸드머스의 고령자를 위해 부드러움과 영양균형, 기호성 등 기준에 맞춘 식품을 선보인다. 식사부터 디저트, 건강 보조제 등 제품군을 갖췄다. 최근 케어푸드 수요가 커지자 소비자 접점을 확대하는 상황. 기존엔 제품을&nbsp;노인복지&middot;요양시설 등 대형 시설 위주에 유통했으나 시장이 커지자 지난 2020년 온라인 판매를 시작했다.&nbsp; 현대그린푸드는&nbsp;특히 유동식보다 영양 섭취가 용이한 &#39;연화식&#39;으로 차별성을 높이고 있다. 지난 2020년&nbsp;케어푸드 전문 브랜드 &#39;그리팅&#39;을 선보였으며 약 1000억원을 투자해 전문 제조 시설인 &#39;스마트 푸드센터&#39;를 준공했다. 연화식은 일반 음식과 맛과 형태는 유사하면서 혀나 잇몸으로 섭취 가능할 만큼 부드럽게 조리한 식품이다. 현대그린푸드에 따르면 재료를 모두 갈아 만드는 유동식보다 맛과 종류가 다양하다. 현대그린푸드는 올해부턴&nbsp;연세대 치과대학과 만드는 유동식보다 맛과 종류가 다양하다. 현대그린푸드는 올해부턴&nbsp;연세대 치과대학과&nbsp;치의학 전문 연구 기술을 활용한 공동 임상연구를 진행한다. 고령의 보철 치료 환자를 대상으로 점도와 영양성분이 조절된 연화식과 유동식 등을 제공한 뒤, 케어푸드가 치료 효과 증진과 삶의 질 향상에 기여하는 정도를 검증하는 방식이다. 현대그린푸드 관계자는 &quot;케어푸드를 통한 식단 관리는 꾸준히 오래 먹는 게 중요한 만큼, 다양성이 필수적&quot;이라며 &quot;이번 임상연구를 통해 고령층의 간편하고 균형 잡힌 영양 섭취를 돕는 케어푸드 제조 역량을 한층 강화할 수 있을 것&quot;이라고 기대했다.&nbsp; 후발주자로는 2021년부터 운영된 아워홈의 케어푸드 브랜드 &#39;케어플러스&#39;, 2020년 론칭한 신세계푸드의 &#39;이지밸런스&#39; 등이 있다. 아워홈은 2023년부턴 노인의 저작 능력 개선을 위한 훈련용 식품 개발을 시작해 올해 상용화를 목표로 연구 중", "token_candidates": [{"token": "2020년", "verbatim": true}, {"token": "신세계푸드", "verbatim": true}], "prefill_numeric": "있음"}, {"id": "fact_c19ba7aa50", "text": "Apple Inc., Garmin Ltd., Omron Healthcare, Inc. 등 주요 기업들이 2023년 북미 웨어러블 헬스케어 기기 시장에서 시장 점유율 상위권을 차지했다", "topic": "웨어러블 헬스케어 기기", "region": "북미", "topic_relevance": "2023년 북미 웨어러블 헬스케어 기기 시장 점유율 1~3위 기업 및 시니어 타겟팅 제품 라인업", "source_url": "https://www.sphericalinsights.com/ko/reports/wearable-healthcare-devices-market", "source_excerpt": "uipment Semiconductors & Electronics Specialty & Fine Chemicals Services Press Release Blogs About us Contact Us Home_chevron\\_right_ Healthcare_chevron\\_right_ 글로벌 웨어러블 헬스케어 기기 시장 제품 유형별(활동 모니터/추적기, 스마트워치, 스마트 의류, 히어러블, 추적기 및 경로), 응용 분야별(스포츠 및 피트니스, 원격 환자 모니터링, 홈 헬스케어, 일반 건강 및 피트니스), 유통 채널별(약국, 전자 상거래 및 하이퍼마켓), 지역별(북미, 유럽, 아시아 태평양, 라틴 아메리카, 중동 및 아프리카)을 기준으로 한 글로벌 웨어러블 건강 관리 기기 시장 규모, 점유율 및 COVID-19 영향 분석, 2023~2033년 분석 및 예측. 산업: Healthcare 출시일 Aug 2024 보고서 ID SI5619 페이지 235 보고서 형식Image 2: PathS ug 2024 보고서 ID SI5619 페이지 235 보고서 형식Image 2: PathSoft 무료 샘플 요청 설명방법론 글로벌 웨어러블 헬스케어 기기 시장 규모는 2033년까지 1,148억 달러에 달할 전망 Spherical Insights & Consulting에서 발행한 조사 보고서에 따르면, 글로벌 웨어러블 의료 기기 시장규모는 2023년 399억 달러에서 2033년 1,148억 달러로 성장할 것으로 예상되며, 이는 예상 기간 동안 연평균 성장률(CAGR) 11.15%로 성장할 것으 urce_url": "https://www.donga.com/news/Life/article/all/20150611/71814359/2", "source_excerpt": "11일 17시 24분 입력 2015-06-11 17:17 2015년 6월 11일 17시 17분 코멘트 개 좋아요 개 코멘트 개 공유하기 공유하기 SNS 퍼가기 카카오톡으로 공유하기 페이스북으로 공유하기 트위터로 공유하기 URL 복사 창 닫기 즐겨찾기 읽기모드 뉴스듣기 글자크기 설정 글자크기 설정 가 가 가 가 가 창 닫기 프린트 “너는 어제 하루 동안 몇 걸음 걸었고, 몇 킬로미터를 이동했으며, 총 몇 칼로리를 소모했니?” 10년 전에 누군가가 당신에게 이런 질문을 했다면, 당신은 질문자를 미쳤다고 생각했을 것이다. 하지만 이제는 하나하나 정확하게 대답할 수 있는 시대가 됐다. 웨어러블 헬스케어 제품이 상용화됐기 때문이다. 웨어러블은 ‘착용할 수 있는’이란 것이 본래의 의미인데, ‘목적에 따라 여러 가지 방법으로 착용하거나 입는 것이 가능하다’라는 의미로 사용된다. 그리고 헬스케어는 기존의 치료 부분 의료서비스에 질병예방 및 관리 개념이 합쳐진 것이다. 이 두 개의 단어를 결합한 ‘  부분 의료서비스에 질병예방 및 관리 개념이 합쳐진 것이다. 이 두 개의 단어를 결합한 ‘웨어러블 헬스케어’는 현재 가장 주목받는 건강 산업 중 하나이다. 웨어러블 헬스케어 기기, 4년 만에 10 배 성장 기대 산업연구원 최윤희 박사팀은 지난 4월 9일 발표한 ‘모바일 세계가 주목하는 미래 스마트 헬스케어 산업’ 보고서를 통해 “바이오기술(BT)과 정보기술(IT)의 융합이 확대되고 의료 패러다임이 예방 관리 중심으로 전환하면서 스마트 헬스케어 산업이 급부상하고 있다”고 밝혔다. 더불어 최 박사팀은 “웨어러블 헬스케어 기기 시장이 2013년 5억 달러(약 5,500억원)에서 2017년 55억 달러(약 6조원)로 10배 이상 성장할 것이라는 전망이 나왔다”고 덧붙였다. PWC의 조사결과 현재 미국인의 20%가 웨어러블 기기를 보유하고 있다고 나타났으며, 마보스키 헬스의 조사 결과에서는 미국인의 81%가 웨어러블 헬스케어 기기를 사용할 의사가 있다고 밝혀, 향후 웨어러블 헬스케어 시장의  %가 웨어러블 헬스케어 기기를 사용할 의사가 있다고 밝혀, 향후 웨어러블 헬스케어 시장의 성장 가능성을 보여준다. 미국과 유럽을 넘어서, 한국을 비롯한 아시아 국가에서도 웨어러블 헬스케어에 대한 관심이 날로 높아져 가는 실정이다. 스마트워치로 집결되는 웨어러블 헬스케어 시장 글로벌 기업들은 진작부터 이런 상황을 예견하고 웨어러블 헬스케어 제품과 관련 앱 개발에 투자를 아끼지 않았다. 삼성전자는 지난해 2월 헬스케어 기능이 특화된 웨어러블 기기 ‘삼성기어핏’을 출시했다. 손목에 찬 후 측정 아이콘을 누르면 현재의 심박수가 나타나 페이스를 조절할 수 있게 도와준다. 이어서 지난해 말에는 ‘삼성 디지털 헬스 플랫폼’을 공개했다. 건강관리뿐 아니라 질병 예방에도 활용, 헬스케어 서비스 생태계를 조성하기 위해서다. 구글도 지낸 해 6월 ‘구글 핏’을 공개했다. 안드로이드 기반의 디바이스와 상호 연동이 가능한 앱으로, 사용자들이 운동량 등 정보를 관리할 수 있도록 하였다. 특히 각종 헬스케어  능한 앱으로, 사용자들이 운동량 등 정보를 관리할 수 있도록 하였다. 특히 각종 헬스케어 앱에서 생성된 건강 정보를 받아 공유할 수도 있다. 애플은 이번 4월에 출시된 애플워치에 다양한 헬스케어 기능을 담았다. 걸음수를 측정해 주고, 소비한 칼로리를 계산해 주는 피트니스 기능과 더불어서 사용자의 심장박동수도 체크할 수 있도록 했다. 특히 애플은 아이폰이나 애플워치로 사용자의 건강정보를 수집하고, 이를 바탕으로 소프트웨어를 만들 수 있는 개발도구 ‘리서치킷(RESEARCHKIT)’을 공개하며 발 빠르게 대응하고 있다. 리서치킷은 질병 치료를 위한 의료 데이터를 한곳에 모아주는 애플리케이션인데, 걸음수와 심박수 등 사용자의 기본적 건강을 체크하는 기능을 넘어 측정된 사용자 건강정보를 한데 모을 수 있도록 했다. ants, 50+ Countries €500M+ Returnable"]}, {"token": "5억", "verbatim": false, "near": []}], "prefill_numeric": "없음"}], "sample_meta": {"built_at": "2026-07-29T15:18:57+09:00", "db": "fact_store/fact_20260729.db", "n": 50, "seed": 20260729, "axis": "groundedness", "strata": {"3": 0.6, "5": 0.24, "2": 0.16}, "note": "_machine_* 필드는 라벨링 UI에 넣지 않는다 (앵커링 방지). 분석 단계 전용."}};
const COMBINE = {"예|있음": 5, "예|일부": 4, "예|없음": 2, "예|해당없음": 5, "부분|있음": 4, "부분|일부": 3, "부분|없음": 2, "부분|해당없음": 3, "아니오|있음": 1, "아니오|일부": 1, "아니오|없음": 1, "아니오|해당없음": 1};
const CLAIMS = ["예", "부분", "아니오"], NUMERICS = ["있음", "일부", "없음", "해당없음"];
const CLAIM_HELP = {"예": "fact의 핵심 주장이 원문에 그대로, 또는 표현만 다른 같은 뜻으로 있다", "부분": "일부만 원문에 있다. 또는 원문에서 추론은 되지만 명시되지 않았다", "아니오": "원문에 없는 주장이다"}, NUMERIC_HELP = {"있음": "fact의 수치·고유명사가 모두 원문에 있다 (표기 차이는 있어도 됨)", "일부": "일부만 원문에 있다", "없음": "원문에 없는 수치·고유명사가 붙어 있다", "해당없음": "fact에 대조할 수치·고유명사가 없다"};
const ACCEPT = 4, REJECT = 2;
const KEY = "gnd_labels_v1";
let L = {}, idx = 0;
try { L = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { L = {}; }

function cur(){ return DATA.items[idx]; }
function rec(){ const it=cur(); if(!L[it.id]) L[it.id]={numeric_scope: it.prefill_numeric}; return L[it.id]; }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(L)); }catch(e){} }
function done(){ return DATA.items.filter(x => L[x.id] && L[x.id].claim_scope).length; }

function esc(s){ return (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function highlight(text, cands){
  let html = esc(text);
  const found = cands.filter(c=>c.verbatim).map(c=>c.token)
                     .sort((a,b)=>b.length-a.length);
  for (const t of found){
    const pat = t.split("").map(ch=>esc(ch).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("[\\s,]*");
    html = html.replace(new RegExp(pat,"g"), m=>"\u0001"+m+"\u0002");
  }
  // \u0001/\u0002 는 자리표시자다. esc() 로 이스케이프한 뒤에 태그를 넣어야
  // 하는데, 태그를 바로 삽입하면 다음 토큰 치환이 태그 안쪽을 건드린다.
  return html.replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>");
}

function render(){
  const it = cur(), c = rec();
  document.getElementById("pos").textContent = `${idx+1} / ${DATA.items.length}`;
  document.getElementById("cnt").textContent = `완료 ${done()}건`;
  document.getElementById("pbar").style.width = (done()/DATA.items.length*100)+"%";
  document.getElementById("meta").innerHTML =
    `${esc(it.topic)} · ${esc(it.region||"지역 미상")} · <a href="${esc(it.source_url)}" target="_blank">출처</a>`
    + `<br>리서치 질문: ${esc(it.topic_relevance)}`;
  document.getElementById("fact").innerHTML = highlight(it.text, it.token_candidates);
  document.getElementById("exc").innerHTML = highlight(it.source_excerpt, it.token_candidates);

  const tk = document.getElementById("tok");
  tk.innerHTML = it.token_candidates.length
    ? it.token_candidates.map(t =>
        `<span class="${t.verbatim?'ok':'ng'}">${t.verbatim?'○':'✕'} ${esc(t.token)}</span>`).join("")
    : `<span class="meta">대조할 수치·고유명사가 없습니다 → ② 는 "해당없음"</span>`;

  document.getElementById("nears").innerHTML = it.token_candidates
    .filter(t=>!t.verbatim && t.near && t.near.length)
    .map(t=>`<div class="near"><b>${esc(t.token)}</b> — 원문에 그대로는 없으나 비슷한 표기가 있습니다:<br>`
            + t.near.map(h=>"…"+esc(h)+"…").join("<br>") + `</div>`).join("");

  const mk = (host, opts, help, field) => {
    host.innerHTML = opts.map(o =>
      `<button class="opt ${c[field]===o?'sel':''}" data-f="${field}" data-v="${o}">`
      + `${o}<small>${esc(help[o])}</small></button>`).join("");
  };
  mk(document.getElementById("q1"), CLAIMS, CLAIM_HELP, "claim_scope");
  mk(document.getElementById("q2"), NUMERICS, NUMERIC_HELP, "numeric_scope");
  document.querySelectorAll("button.opt").forEach(b =>
    b.onclick = () => pick(b.dataset.f, b.dataset.v));

  const res = document.getElementById("res");
  if (c.claim_scope && c.numeric_scope){
    const s = COMBINE[c.claim_scope + "|" + c.numeric_scope];
    const st = s>=ACCEPT ? "채택" : (s<=REJECT ? "기각" : "보류");
    res.innerHTML = `환산 결과 → <b>${s}점</b> (${st})`;
  } else {
    res.innerHTML = `<span class="meta">두 질문에 모두 답하시면 점수가 환산됩니다</span>`;
  }
  document.getElementById("note").value = c.note || "";
  const f = document.getElementById("flag");
  f.classList.toggle("on", !!c.uncertain);
  document.getElementById("fstat").textContent = c.uncertain ? "애매함으로 표시됨" : "";
}

function pick(field, v){ rec()[field] = v; persist(); render(); }

document.getElementById("note").addEventListener("input", e => { rec().note = e.target.value; persist(); });
document.getElementById("prev").onclick = () => { if(idx>0){ idx--; render(); window.scrollTo(0,0);} };
document.getElementById("next").onclick = () => { if(idx<DATA.items.length-1){ idx++; render(); window.scrollTo(0,0);} };
document.getElementById("flag").onclick = () => { const c=rec(); c.uncertain=!c.uncertain; persist(); render(); };
document.getElementById("jump").onclick = () => {
  const i = DATA.items.findIndex(x => !(L[x.id] && L[x.id].claim_scope));
  if (i>=0){ idx=i; render(); window.scrollTo(0,0); } else alert("모두 라벨했습니다.");
};
document.getElementById("reset").onclick = () => {
  if (confirm("라벨을 전부 지웁니다. 계속할까요?")){ L={}; persist(); render(); }
};
document.getElementById("save").onclick = () => {
  const labels = DATA.items.filter(x=>L[x.id] && L[x.id].claim_scope).map(x => {
    const c = L[x.id];
    return { id:x.id, topic:x.topic, text:x.text,
             claim_scope:c.claim_scope, numeric_scope:c.numeric_scope,
             human_groundedness: COMBINE[c.claim_scope+"|"+c.numeric_scope],
             uncertain: !!c.uncertain, note: c.note || "" };
  });
  const payload = { labeled_at:new Date().toISOString(), axis:"groundedness",
    method:"분해 척도 (핵심 주장 + 수치·고유명사 → 코드가 환산). ②는 코드가 후보를 제시하고 사람이 확정 — 반자동.",
    labeler:"이후윤", n:labels.length, sample:DATA.sample_meta, labels };
  const blob = new Blob([JSON.stringify(payload,null,1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "groundedness_labels.json";
  document.body.appendChild(a); a.click(); a.remove();
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  if (["1","2","3"].includes(k)) pick("claim_scope", CLAIMS[+k-1]);
  else if (["q","w","e","r"].includes(k)) pick("numeric_scope", NUMERICS["qwer".indexOf(k)]);
  else if (e.key==="ArrowLeft") document.getElementById("prev").click();
  else if (e.key==="ArrowRight") document.getElementById("next").click();
  else if (e.key==="/") document.getElementById("flag").click();
});
render();
</script></body></html>
