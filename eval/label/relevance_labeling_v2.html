const SCOPES = [
  ["예",    "범위 안"],
  ["부분",  "인접하지만 불일치"],
  ["아니오", "범위 밖"],
];
// eval/label_scale.py 의 COMBINE 표와 반드시 동일해야 한다.
const COMBINE = {
  "예|예":5, "예|부분":4, "부분|예":4, "부분|부분":3,
  "예|아니오":2, "부분|아니오":2, "아니오|예":2, "아니오|부분":1, "아니오|아니오":1,
};
const L = {};                       // id -> {topic_scope, market_scope}
let idx = 0;

try { const s = localStorage.getItem("relLabels_v2");
      if (s) Object.assign(L, JSON.parse(s)); } catch(e){}

function persist(){
  try { localStorage.setItem("relLabels_v2", JSON.stringify(L)); } catch(e){}
  refreshRaw();
}

function done(){ return DATA.items.filter(it => L[it.id] && L[it.id].topic_scope && L[it.id].market_scope).length; }

function render(){
  const n = DATA.items.length, d = done();
  document.getElementById("pi").style.width = (d/n*100)+"%";
  document.getElementById("pt").textContent = `${d} / ${n} 완료`;
  if (idx >= n) return renderDone();

  const it = DATA.items[idx];
  const cur = L[it.id] || {};
  const score = (cur.topic_scope && cur.market_scope)
      ? COMBINE[cur.topic_scope+"|"+cur.market_scope] : null;

  document.getElementById("app").innerHTML = `
   <div class="card">
    <div class="ctx">
      <b>연구대상</b><span>${esc(it.topic)}</span>
      <b>목표시장</b><span>${esc(it.target_market)}</span>
    </div>
    <div class="fact">${esc(it.text)}</div>

    <div class="q">
      <p><b>① 이 fact의 주제가 「${esc(it.topic)}」 범위 안입니까?</b></p>
      <p class="hint">제품·서비스·산업의 종류만 보십시오. 지역은 다음 질문에서 봅니다.</p>
      <div class="opts" data-k="topic_scope">${btns(cur.topic_scope)}</div>
    </div>

    <div class="q">
      <p><b>② 이 fact의 지역·대상이 「${esc(it.target_market)}」 범위 안입니까?</b></p>
      <p class="hint">어느 나라·지역이고 누구에 관한 이야기인지만 보십시오.</p>
      <div class="opts" data-k="market_scope">${btns(cur.market_scope)}</div>
    </div>

    ${score ? `<div class="res">주제 <b>${cur.topic_scope}</b> · 지역·대상 <b>${cur.market_scope}</b>
       → 관련성 <b>${score}점</b></div>` : ""}
   </div>
   <div class="nav">
     <button id="prev" ${idx===0?"disabled":""}>← 이전</button>
     <span style="font-size:13px;color:var(--mut)">${it.id} · ${idx+1} / ${n}</span>
     <button id="next" ${idx>=n-1?"disabled":""}>다음 →</button>
   </div>`;

  document.querySelectorAll(".opts").forEach(box =>
    box.querySelectorAll("button").forEach(b =>
      b.onclick = () => pick(box.dataset.k, b.dataset.v)));
  const p=document.getElementById("prev"), x=document.getElementById("next");
  if(p) p.onclick=()=>{idx=Math.max(0,idx-1);render();};
  if(x) x.onclick=()=>{idx++;render();};
}

function btns(sel){
  return SCOPES.map(([v,d],i)=>
    `<button data-v="${v}" class="${sel===v?"on":""}">${v}<small>${d}</small></button>`).join("");
}

function pick(key, val){
  const it = DATA.items[idx];
  L[it.id] = Object.assign({}, L[it.id], {[key]: val});
  persist();
  const c = L[it.id];
  if (c.topic_scope && c.market_scope){
    render();
    setTimeout(()=>{ if(idx < DATA.items.length-1){ idx++; render(); } else render(); }, 480);
  } else render();
}

function payload(){
  return { labeled_at: new Date().toISOString(), axis: "relevance",
    method: "분해 척도 v2 (주제 범위 + 지역·대상 범위 → 코드가 환산)",
    labeler: "이후윤", n: done(),
    labels: DATA.items.map(it => {
      const c = L[it.id] || {};
      const s = (c.topic_scope && c.market_scope) ? COMBINE[c.topic_scope+"|"+c.market_scope] : null;
      return { id: it.id, dataset: it.dataset, text: it.text,
               topic_scope: c.topic_scope ?? null, market_scope: c.market_scope ?? null,
               human_relevance: s };
    })};
}
function refreshRaw(){ const o=document.getElementById("out"); if(o) o.value=JSON.stringify(payload(),null,1); }

document.getElementById("save").onclick = () => {
  const blob = new Blob([JSON.stringify(payload(),null,1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "relevance_labels.json";
  document.body.appendChild(a); a.click(); a.remove();
};
document.getElementById("toggle").onclick = () => {
  const r=document.getElementById("raw");
  r.style.display = r.style.display==="none" ? "block" : "none"; refreshRaw();
};

function renderDone(){
  const d = done();
  document.getElementById("app").innerHTML = `
    <div class="card done"><h2>라벨링 완료 — ${d} / ${DATA.items.length}건</h2>
      <p>아래 <b>[지금까지 저장]</b> 을 눌러 <code>relevance_labels.json</code> 을 내려받으신 뒤,
         <code>multi-agent-system/eval/label/</code> 로 옮겨 주십시오.</p>
      <p style="font-size:14px;color:var(--mut)">검증기·상위 모델 점수와의 비교는 그 다음에 하겠습니다.</p>
      <div class="nav"><button id="back">← 처음부터 다시 보기</button></div>
    </div>`;
  document.getElementById("back").onclick = ()=>{idx=0;render();};
  refreshRaw();
}

function esc(s){ return String(s ?? "").replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

document.addEventListener("keydown", e=>{
  const it = DATA.items[idx]; if(!it) return;
  const c = L[it.id] || {};
  if (["1","2","3"].includes(e.key)){
    const v = SCOPES[+e.key-1][0];
    pick(c.topic_scope ? "market_scope" : "topic_scope", v);
  } else if (e.key==="ArrowLeft" && idx>0){ idx--; render(); }
  else if (e.key==="ArrowRight" && idx<DATA.items.length-1){ idx++; render(); }
});
render(); refreshRaw();
</script></body></html>
